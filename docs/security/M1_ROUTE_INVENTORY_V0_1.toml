schema = "xenia-m1-route-inventory-v1"
version = 1
status = "partial_source_census"
completeness = "indeterminate"
reviewed_commit = "9bc2687b7fa61ffe36e0809f27d703c25cfbb1fa"
claim_ceiling = "Known daemon paths and gate locations were source-reviewed; the operator-revoke latch now closes local M1 lane admission on observed revocation before durable ledger transition. Alternate binaries, platform helpers, plugins, ambient OS interfaces, all feature combinations, direct bypasses, and atomic OS/network effect coupling are not yet qualified."
authorization_semantics = "M1 local consent/session permission only; no Mycelix ROS-005 runtime decision is consumed by this source snapshot."
effect_evidence = "Current allow_*_flow events are admission/gate evidence, not proof of local OS completion or remote observation. See Xenia issue #510."
route_coverage_owner = "Xenia issue #512; Mycelix route-mediation oracle #6213."

[source_files]
daemon = "apps/xenia-peer/src/main.rs@12fe1336f6a5b2813f772aa8e8c1cec70b33da08"
consent_server = "apps/xenia-peer/src/consent_server.rs@558fab9a448d3aad8de2416764f72e6ee7db84ba"
sealed_operator_channel = "apps/xenia-peer/src/operator_sealed_channel.rs@65a4c7f3644ba38b4e76cedb177c501eff6a5db7"
file_transfer = "apps/xenia-peer/src/file_transfer.rs@0b9db18f1eb8cf9842945b075c848a3e5b0b718e"
runtime = "apps/xenia-peer/src/m1_runtime.rs@b0fbfd3570cc87a82da8413eee1923605a85669b"
permission_model = "crates/xenia-peer-core/src/m1_session.rs@fa19a4826f2d078a47439e02217c4562f2aab007"

[local_revocation]
trigger = "ConsentServer::apply_consent_decision stores the shared operator-revoked AtomicBool with SeqCst ordering when a valid Revoke action is accepted."
runtime_binding = "M1RuntimeSession binds the same Arc<AtomicBool> before it is shared with sender, input, and file-transfer tasks."
enforcement = "Every source-work preflight and every final M1 lane admission gate rejects with OperatorRevocationObserved while the owning send loop is still pending its durable ConsentKind::Revocation append."
durable_record_owner = "The main session loop remains the owner of M1RuntimeSession::revoke() and the canonical consent-ledger transition."
claim_limit = "This closes the local operator-revocation observation window before effect admission. It does not atomically couple an already-passed final check to a later OS or network operation and does not establish distributed revocation propagation."

[[routes]]
id = "M1-HOST-SCREEN-001"
effect = "capture and disclose host screen frames"
entrypoint = "apps/xenia-peer/src/main.rs::main daemon send loop"
source_api = "capture.capture()"
direction = "host_to_viewer"
permission = "StreamFrame"
action_id = "xenia.screen.view"
resource = "exact authenticated Xenia host resource"
source_preflight = "M1RuntimeSession::preflight_frame_flow before capture.capture()"
final_gate = "M1RuntimeSession::allow_frame_flow after frame sealing and immediately before send_envelope"
effect_owner = "local transport send owner in daemon send loop"
transport_boundary = "AnySendHalf::send_envelope"
coverage = "source_reviewed"
negative_bypass_controls = "not_yet_implemented"
maximum_evidence_claim = "local lane admitted and local transport send returned; not proof of viewer receipt, render, or human observation"

