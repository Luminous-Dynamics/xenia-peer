effect_owner = "IncomingFileStager filesystem owner"
transport_boundary = "authenticated inbound file-transfer envelopes"
coverage = "source_reviewed"
negative_bypass_controls = "not_yet_implemented"
maximum_evidence_claim = "receiver staging and hash-verified local publication; peer receipt/independent observer is distinct"

