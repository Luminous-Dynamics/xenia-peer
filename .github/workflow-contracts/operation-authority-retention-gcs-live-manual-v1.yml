# INERT CONTRACT FILE — intentionally outside .github/workflows/.
# Activation requires a later reviewed move into .github/workflows after ADR-036 is compile-qualified.
name: Operation Authority Retention GCS Live Manual V1

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact qualification phase
        required: true
        type: choice
        options:
          - provision
          - runtime
          - lock
          - teardown
      mode:
        description: ADR-035 mode
        required: true
        type: choice
        options:
          - reversible
          - irreversible-bucket-lock
      expected_sha:
        description: Exact reviewed main-branch commit to qualify
        required: true
        type: string
      project_id:
        required: true
        type: string
      project_number:
        required: true
        type: string
      location:
        required: true
        type: string
      run_nonce_hex:
        required: true
        type: string
      retention_seconds:
        required: true
        type: string
      runtime_member:
        description: Exact IAM member expected for runtime credential
        required: true
        type: string
      admin_member:
        description: Exact IAM member expected for admin credential
        required: true
        type: string
      runtime_principal_digest_hex:
        required: true
        type: string
      admin_principal_digest_hex:
        required: true
        type: string
      disposable_ack:
        required: true
        type: string
      irreversible_lock_ack:
        description: Required only for phase=lock / irreversible-bucket-lock
        required: false
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: ${{ github.ref == 'refs/heads/main' && inputs.phase == 'provision' && inputs.mode == 'reversible' }}
    runs-on: ubuntu-latest
    environment: xenia-gcs-qual-admin-reversible
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact reviewed source and admin identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}" = "${{ inputs.admin_member }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Provision reversible qualification bucket
        env: &qualification_env
          XENIA_GCS_LIVE_QUALIFICATION: DISPOSABLE_QUALIFICATION_ONLY
          XENIA_GCS_LIVE_MODE: ${{ inputs.mode }}
          XENIA_GCS_LIVE_PROJECT_ID: ${{ inputs.project_id }}
          XENIA_GCS_LIVE_PROJECT_NUMBER: ${{ inputs.project_number }}
          XENIA_GCS_LIVE_LOCATION: ${{ inputs.location }}
          XENIA_GCS_LIVE_RUN_NONCE_HEX: ${{ inputs.run_nonce_hex }}
          XENIA_GCS_LIVE_RETENTION_SECONDS: ${{ inputs.retention_seconds }}
          XENIA_GCS_LIVE_RUNTIME_MEMBER: ${{ inputs.runtime_member }}
          XENIA_GCS_LIVE_ADMIN_MEMBER: ${{ inputs.admin_member }}
          XENIA_GCS_LIVE_RUNTIME_PRINCIPAL_DIGEST_HEX: ${{ inputs.runtime_principal_digest_hex }}
          XENIA_GCS_LIVE_ADMIN_PRINCIPAL_DIGEST_HEX: ${{ inputs.admin_principal_digest_hex }}
          XENIA_GCS_LIVE_DISPOSABLE_ACK: ${{ inputs.disposable_ack }}
          XENIA_GCS_LIVE_IRREVERSIBLE_LOCK_ACK: ${{ inputs.irreversible_lock_ack }}
        run: cargo run --locked --manifest-path experimental/xenia-operation-authority-retention-gcs-live-harness/Cargo.toml --features live-gcs-network --bin xenia_gcs_admin_provision_v1

  runtime:
    if: ${{ github.ref == 'refs/heads/main' && inputs.phase == 'runtime' }}
    runs-on: ubuntu-latest
    environment: xenia-gcs-qual-runtime
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact reviewed source and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}" = "${{ inputs.runtime_member }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Probe runtime credential effective permissions
        env: *qualification_env
        run: cargo run --locked --manifest-path experimental/xenia-operation-authority-retention-gcs-live-harness/Cargo.toml --features live-gcs-network --bin xenia_gcs_runtime_permissions_v1

  lock:
    if: ${{ github.ref == 'refs/heads/main' && inputs.phase == 'lock' && inputs.mode == 'irreversible-bucket-lock' }}
    runs-on: ubuntu-latest
    environment: xenia-gcs-qual-admin-lock
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact reviewed source, admin identity, and non-empty lock acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}" = "${{ inputs.admin_member }}"
          test -n "${{ inputs.irreversible_lock_ack }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Irreversibly lock exact disposable retention policy
        env: *qualification_env
        run: cargo run --locked --manifest-path experimental/xenia-operation-authority-retention-gcs-live-harness/Cargo.toml --features live-gcs-network --bin xenia_gcs_admin_lock_v1

  teardown:
    if: ${{ github.ref == 'refs/heads/main' && inputs.phase == 'teardown' }}
    runs-on: ubuntu-latest
    environment: xenia-gcs-qual-admin-cleanup
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact reviewed source and admin identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}" = "${{ inputs.admin_member }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Explicit qualification teardown
        env: *qualification_env
        run: cargo run --locked --manifest-path experimental/xenia-operation-authority-retention-gcs-live-harness/Cargo.toml --features live-gcs-network --bin xenia_gcs_admin_teardown_v1
