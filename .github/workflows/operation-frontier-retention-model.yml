name: Operation Frontier Retention Model

on:
  pull_request:
    paths:
      - "crates/xenia-ledger/**"
      - "contracts/xenia-operation-store-frontier/**"
      - "contracts/xenia-operation-frontier-ledger-witness/**"
      - "experimental/xenia-operation-frontier-ledger-adapter/**"
      - "experimental/xenia-operation-frontier-retention-bundle/**"
      - "experimental/xenia-operation-frontier-retention-model/**"
      - "docs/ADR-022-operation-frontier-ledger-witness.md"
      - "docs/ADR-023-operation-frontier-external-retention.md"
      - "docs/ADR-024-operation-frontier-retention-model.md"
      - ".github/workflows/operation-frontier-retention-model.yml"
  push:
    branches:
      - "feat/operation-frontier-retention-model-v1"
      - main
    paths:
      - "crates/xenia-ledger/**"
      - "contracts/xenia-operation-store-frontier/**"
      - "contracts/xenia-operation-frontier-ledger-witness/**"
      - "experimental/xenia-operation-frontier-ledger-adapter/**"
      - "experimental/xenia-operation-frontier-retention-bundle/**"
      - "experimental/xenia-operation-frontier-retention-model/**"
      - "docs/ADR-022-operation-frontier-ledger-witness.md"
      - "docs/ADR-023-operation-frontier-external-retention.md"
      - "docs/ADR-024-operation-frontier-retention-model.md"
      - ".github/workflows/operation-frontier-retention-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Append-only Durability Semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy
      - name: Resolve standalone lock
        working-directory: experimental/xenia-operation-frontier-retention-model
        run: cargo generate-lockfile
      - name: Record dependency topology
        working-directory: experimental/xenia-operation-frontier-retention-model
        run: |
          cargo tree -p xenia-operation-frontier-retention-model
          cargo tree -p xenia-operation-frontier-retention-bundle
          cargo tree -p xenia-operation-frontier-ledger-adapter
      - name: Format
        run: cargo fmt --manifest-path experimental/xenia-operation-frontier-retention-model/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path experimental/xenia-operation-frontier-retention-model/Cargo.toml --locked
      - name: Strict Clippy
        run: cargo clippy --manifest-path experimental/xenia-operation-frontier-retention-model/Cargo.toml --locked --all-targets -- -D warnings

  msrv:
    name: Retention Model MSRV Rust 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - name: Resolve standalone lock
        working-directory: experimental/xenia-operation-frontier-retention-model
        run: cargo generate-lockfile
      - name: Check complete dependency stack
        run: cargo check --manifest-path experimental/xenia-operation-frontier-retention-model/Cargo.toml --locked --all-targets
