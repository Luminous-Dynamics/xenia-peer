name: temporary Cargo lockfile regeneration

on:
  push:
    branches:
      - chore/refresh-security-advisory-locks-v0.1

permissions:
  contents: write

concurrency:
  group: cargo-lock-refresh-{{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Resolve only the reviewed dependency updates
        run: |
          nix develop .#ci --command bash -c '
            set -euo pipefail
            cargo update --package arboard --precise 3.7.0
            cargo update --package clipboard-win --precise 5.4.3
            cargo update --package rustix --precise 1.1.6
            cargo metadata --locked --format-version 1 --no-deps >/dev/null
          '
      - name: Commit Cargo-generated lockfile and remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo produced no lockfile delta; refusing to claim regeneration."
            rm .github/workflows/lockfile-refresh.yml
            git add .github/workflows/lockfile-refresh.yml
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ci: remove temporary lockfile regeneration workflow"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit 1
          fi
          rm .github/workflows/lockfile-refresh.yml
          git add Cargo.lock .github/workflows/lockfile-refresh.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(deps): regenerate Cargo lockfile with fixed crates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
