name: Operation Authority Retention GCS Live Activation V1

on:
  pull_request:
    paths:
      - "experimental/xenia-operation-authority-retention-gcs-live-activation/**"
      - ".github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml"
      - "docs/ADR-038-live-gcs-workflow-activation-readiness.md"
      - ".github/workflows/operation-authority-retention-gcs-live-activation-v1.yml"
  push:
    branches:
      - "feat/operation-authority-retention-gcs-live-activation-v1"
    paths:
      - "experimental/xenia-operation-authority-retention-gcs-live-activation/**"
      - ".github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml"
      - "docs/ADR-038-live-gcs-workflow-activation-readiness.md"
      - ".github/workflows/operation-authority-retention-gcs-live-activation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Activation readiness Rust 1.96
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Assert activation surface is still inert
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml
          test ! -e .github/workflows/operation-authority-retention-gcs-live-manual-v1.yml
          ! grep -R -F 'google-github-actions/auth@' experimental/xenia-operation-authority-retention-gcs-live-activation
          ! grep -R -F 'google-cloud-' experimental/xenia-operation-authority-retention-gcs-live-activation
      - name: Resolve first-pass dependency lock
        working-directory: experimental/xenia-operation-authority-retention-gcs-live-activation
        run: cargo generate-lockfile
      - name: Format
        working-directory: experimental/xenia-operation-authority-retention-gcs-live-activation
        run: cargo fmt --check
      - name: Test
        working-directory: experimental/xenia-operation-authority-retention-gcs-live-activation
        run: cargo test --locked
      - name: Clippy
        working-directory: experimental/xenia-operation-authority-retention-gcs-live-activation
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Capture readiness-contract evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/gcs-live-activation-v1-evidence
          mkdir -p "$E"
          git rev-parse HEAD > "$E/HEAD.txt"
          rustc --version --verbose > "$E/RUSTC.txt"
          cargo --version > "$E/CARGO.txt"
          sha256sum .github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml > "$E/INERT_WORKFLOW_SHA256.txt"
          sha256sum \
            experimental/xenia-operation-authority-retention-gcs-live-activation/Cargo.toml \
            experimental/xenia-operation-authority-retention-gcs-live-activation/src/lib.rs \
            docs/ADR-038-live-gcs-workflow-activation-readiness.md \
            .github/workflows/operation-authority-retention-gcs-live-activation-v1.yml \
            > "$E/SOURCE_SHA256SUMS.txt"
          if test -f experimental/xenia-operation-authority-retention-gcs-live-activation/Cargo.lock; then
            cp experimental/xenia-operation-authority-retention-gcs-live-activation/Cargo.lock "$E/Cargo.lock"
            sha256sum "$E/Cargo.lock" > "$E/CARGO_LOCK_SHA256.txt"
            cargo tree --locked --manifest-path experimental/xenia-operation-authority-retention-gcs-live-activation/Cargo.toml > "$E/CARGO_TREE.txt"
          fi
          cat > "$E/FROZEN_ACTIVATION_IDENTITY.txt" <<'EOF'
          repository_id=1214159052
          repository_owner_id=216969177
          inert_workflow_path=.github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml
          active_workflow_path=.github/workflows/operation-authority-retention-gcs-live-manual-v1.yml
          manifest_max_lifetime_ms=86400000
          attestation_max_lifetime_ms=900000
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operation-authority-retention-gcs-live-activation-v1-evidence
          path: /tmp/gcs-live-activation-v1-evidence

  msrv:
    name: Activation readiness MSRV Rust 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - name: Resolve first-pass dependency lock
        working-directory: experimental/xenia-operation-authority-retention-gcs-live-activation
        run: cargo generate-lockfile
      - name: Build declared MSRV
        working-directory: experimental/xenia-operation-authority-retention-gcs-live-activation
        run: cargo test --locked
