name: M1 Effect Commit Model

on:
  pull_request:
    paths:
      - "crates/xenia-peer-core/src/m1_effect.rs"
      - "crates/xenia-peer-core/src/lib.rs"
      - "crates/xenia-peer-core/src/m1_session.rs"
      - ".github/workflows/m1-effect-commit-model.yml"
  push:
    branches:
      - "research/m1-effect-commit-model-v0.1"
    paths:
      - "crates/xenia-peer-core/src/m1_effect.rs"
      - "crates/xenia-peer-core/src/lib.rs"
      - "crates/xenia-peer-core/src/m1_session.rs"
      - ".github/workflows/m1-effect-commit-model.yml"

permissions:
  contents: read

concurrency:
  group: m1-effect-commit-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-model:
    name: format, test, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Effect model tests
        run: cargo test --locked -p xenia-peer-core m1_effect::tests
      - name: Core package Clippy
        run: cargo clippy --locked -p xenia-peer-core --all-targets -- -D warnings
