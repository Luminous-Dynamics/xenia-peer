name: One-shot Operation Frontier Retention Bundle Formatter

on:
  push:
    branches:
      - "feat/operation-frontier-retention-bundle-v1"
    paths:
      - "experimental/xenia-operation-frontier-retention-bundle/src/lib.rs"
      - ".github/workflows/operation-frontier-retention-bundle-format-once.yml"

permissions:
  contents: write

concurrency:
  group: operation-frontier-retention-bundle-format-once
  cancel-in-progress: false

jobs:
  rustfmt-and-remove-self:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Apply exact rustfmt repair
        shell: bash
        run: |
          set -euo pipefail

          cargo fmt --manifest-path experimental/xenia-operation-frontier-retention-bundle/Cargo.toml

          mapfile -t changed < <(git diff --name-only)
          printf 'rustfmt changed:\n'
          printf '  %s\n' "${changed[@]}"

          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "experimental/xenia-operation-frontier-retention-bundle/src/lib.rs"

          git diff --check
          git rm .github/workflows/operation-frontier-retention-bundle-format-once.yml

          git config user.name "xenia-qualification-bot"
          git config user.email "xenia-qualification-bot@users.noreply.github.com"
          git add experimental/xenia-operation-frontier-retention-bundle/src/lib.rs

          git diff --cached --check
          git status --short
          git commit -m "style(operation): rustfmt retained frontier bundle"
          git push origin "HEAD:${{ github.ref_name }}"
