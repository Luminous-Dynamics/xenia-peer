name: Crypto Provider Assurance V1

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/xenia-handshake/Cargo.toml"
      - "crates/xenia-ledger/Cargo.toml"
      - "docs/crypto/PROVIDER_ASSURANCE_V1.md"
      - "docs/crypto/provider_assurance_v1.json"
      - "scripts/validate_crypto_provider_assurance_v1.py"
      - ".github/workflows/crypto-provider-assurance-v1.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/xenia-handshake/Cargo.toml"
      - "crates/xenia-ledger/Cargo.toml"
      - "docs/crypto/PROVIDER_ASSURANCE_V1.md"
      - "docs/crypto/provider_assurance_v1.json"
      - "scripts/validate_crypto_provider_assurance_v1.py"
      - ".github/workflows/crypto-provider-assurance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-identity:
    name: Validate exact provider identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          git status --short

      - name: Validate Cargo lock graph parses under Cargo
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Validate provider identity and negative controls
        run: python3 scripts/validate_crypto_provider_assurance_v1.py .

      - name: Retain deterministic assurance digests in log
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            Cargo.lock \
            Cargo.toml \
            crates/xenia-handshake/Cargo.toml \
            crates/xenia-ledger/Cargo.toml \
            docs/crypto/PROVIDER_ASSURANCE_V1.md \
            docs/crypto/provider_assurance_v1.json \
            scripts/validate_crypto_provider_assurance_v1.py

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
