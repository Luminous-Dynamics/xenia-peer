name: Security Stack Integrity

on:
  pull_request:
    paths:
      - ".github/security-stack-integrity.json"
      - ".github/workflows/security-stack-integrity.yml"
      - "scripts/verify_security_stack.py"
      - "scripts/test_verify_security_stack.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-stack-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFICATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify reviewed stack ancestry and deltas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact verifier source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" \
            python3 -m py_compile \
              scripts/verify_security_stack.py \
              scripts/test_verify_security_stack.py
          sha256sum \
            .github/security-stack-integrity.json \
            scripts/verify_security_stack.py \
            scripts/test_verify_security_stack.py
          test -z "$(git status --porcelain)"

      - name: Exercise offline adversarial drift fixtures
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 --version
            PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" \
              python3 scripts/test_verify_security_stack.py
          } 2>&1 | tee "$RUNNER_TEMP/security-stack-integrity-selftest.txt"
          test -z "$(git status --porcelain)"

      - name: Verify live security stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_security_stack.py \
            --manifest .github/security-stack-integrity.json \
            --report "$RUNNER_TEMP/security-stack-integrity-report.json"

      - name: Assert verifier source remained immutable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Retain stack-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-stack-integrity-${{ env.QUALIFICATION_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/security-stack-integrity-selftest.txt
            ${{ runner.temp }}/security-stack-integrity-report.json
          if-no-files-found: error
          retention-days: 90
