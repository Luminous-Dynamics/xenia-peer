name: Xenia Artifacts

on:
  pull_request:
    paths-ignore:
      # Experimental protocol-contract crates are deliberately outside the
      # production workspace and have dedicated Rust/MSRV/Node evidence lanes.
      # Remove these exemptions in the same PR that integrates any of them into
      # production workspace/runtime code.
      - "crates/xenia-negotiation/**"
      - "crates/xenia-negotiation-codec/**"
      - "crates/xenia-handshake-v2-contract/**"
      - "crates/xenia-authority-*/**"
      - ".github/workflows/negotiated-context.yml"
      - ".github/workflows/negotiation-policy.yml"
      - ".github/workflows/handshake-v2-contract.yml"
      - ".github/workflows/authority-*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect validation artifacts
        run: |
          chmod +x scripts/*.sh scripts/*.py || true
          scripts/ci-collect-artifacts.sh . _archive/ci-artifacts
      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xenia-validation-artifacts
          path: _archive/ci-artifacts
          if-no-files-found: error