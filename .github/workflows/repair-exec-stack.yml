name: Repair Exec Stack Qualification

on:
  push:
    branches:
      - feat/privileged-operation-grants-v1
    paths:
      - .github/workflows/repair-exec-stack.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/privileged-operation-grants-v1
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Regenerate workspace lock metadata minimally
        run: cargo metadata --format-version 1 > /dev/null

      - name: Format the complete Rust workspace
        run: cargo fmt --all

      - name: Verify Cargo boundary inventory
        run: python3 scripts/check-cargo-boundaries.py --strict-unknown .

      - name: Commit qualification repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-exec-stack.yml
          git add Cargo.lock crates scripts/check-cargo-boundaries.py
          if git diff --cached --quiet; then
            echo "No qualification repair changes were produced." >&2
            exit 1
          fi
          git commit -m "chore(exec): restore qualification integrity"
          git push origin HEAD:feat/privileged-operation-grants-v1
