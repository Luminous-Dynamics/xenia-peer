name: ML-KEM Oracle Pin V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "docs/crypto/MLKEM_ORACLE_PIN_V1.md"
      - "docs/crypto/mlkem_oracle_pin_v1.json"
      - "scripts/validate_mlkem_oracle_pin_v1.py"
      - ".github/workflows/mlkem-oracle-pin-v1.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "docs/crypto/MLKEM_ORACLE_PIN_V1.md"
      - "docs/crypto/mlkem_oracle_pin_v1.json"
      - "scripts/validate_mlkem_oracle_pin_v1.py"
      - ".github/workflows/mlkem-oracle-pin-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-pin:
    name: Validate test-only ML-KEM oracle identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          git status --short

      - name: Validate oracle identity, boundaries, and negative controls
        run: python3 scripts/validate_mlkem_oracle_pin_v1.py .

      - name: Retain deterministic oracle-pin digests in log
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            docs/crypto/MLKEM_ORACLE_PIN_V1.md \
            docs/crypto/mlkem_oracle_pin_v1.json \
            scripts/validate_mlkem_oracle_pin_v1.py

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
