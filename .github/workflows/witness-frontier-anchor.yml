name: Witness Frontier Anchor

on:
  pull_request:
    paths:
      - 'crates/xenia-ledger/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/witness-frontier-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness-frontier-anchor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  source:
    name: Typed anchor + freshness observation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt

      - name: Format xenia-ledger
        run: cargo fmt --check --package xenia-ledger

      - name: Test xenia-ledger
        run: cargo test --locked -p xenia-ledger

      - name: Clippy xenia-ledger
        run: cargo clippy --locked -p xenia-ledger --all-targets -- -D warnings

      - name: Record exact-head evidence
        if: always()
        run: |
          E="$RUNNER_TEMP/witness-frontier-anchor-evidence"
          mkdir -p "$E"
          git rev-parse HEAD > "$E/HEAD"
          git rev-parse HEAD^{tree} > "$E/TREE"
          rustc -Vv > "$E/RUSTC.txt"
          cargo -V > "$E/CARGO.txt"
          sha256sum Cargo.lock > "$E/CARGO_LOCK_SHA256.txt"
          sha256sum crates/xenia-ledger/src/witness_frontier_anchor.rs > "$E/WITNESS_FRONTIER_ANCHOR_SHA256.txt"
          sha256sum crates/xenia-ledger/tests/witness_frontier_interop.rs > "$E/WITNESS_FRONTIER_INTEROP_SHA256.txt"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-frontier-anchor-${{ github.sha }}
          path: ${{ runner.temp }}/witness-frontier-anchor-evidence
          if-no-files-found: error
          retention-days: 14
