name: Handshake V2 Contract

on:
  pull_request:
    paths:
      - "crates/xenia-negotiation/**"
      - "crates/xenia-negotiation-codec/**"
      - "crates/xenia-handshake-v2-contract/**"
      - ".github/workflows/handshake-v2-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handshake-v2-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: V2 contract (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xenia-negotiation
            crates/xenia-negotiation-codec
            crates/xenia-handshake-v2-contract
      - name: Format
        run: cargo fmt --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --check
      - name: Check
        run: cargo check --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --all-targets -- -D warnings
      - name: Test V2 message, size, V5, and transcript contract
        run: cargo test --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml
      - name: Docs
        run: cargo doc --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --no-deps

  msrv:
    name: V2 contract MSRV (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xenia-negotiation
            crates/xenia-negotiation-codec
            crates/xenia-handshake-v2-contract
      - name: Check MSRV
        run: cargo check --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --all-targets
