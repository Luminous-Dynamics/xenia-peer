name: Handshake V2 Contract

on:
  pull_request:
    paths:
      - "crates/xenia-negotiation/**"
      - "crates/xenia-negotiation-codec/**"
      - "crates/xenia-handshake-v2-contract/**"
      - "test-vectors/handshake-v2-message-contract.json"
      - "test-vectors/verify-handshake-v2-message-contract.mjs"
      - ".github/workflows/handshake-v2-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handshake-v2-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: V2 contract (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xenia-negotiation
            crates/xenia-negotiation-codec
            crates/xenia-handshake-v2-contract
            crates/xenia-handshake-v2-contract/finalize-binding
      - name: Format
        run: |
          cargo fmt --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --check
          cargo fmt --manifest-path crates/xenia-handshake-v2-contract/finalize-binding/Cargo.toml --check
      - name: Check
        run: |
          cargo check --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --all-targets
          cargo check --manifest-path crates/xenia-handshake-v2-contract/finalize-binding/Cargo.toml --all-targets
      - name: Clippy
        run: |
          cargo clippy --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/xenia-handshake-v2-contract/finalize-binding/Cargo.toml --all-targets -- -D warnings
      - name: Test V2 message, finalize binding, size, V5, transcript, and frozen vectors
        run: |
          cargo test --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml
          cargo test --manifest-path crates/xenia-handshake-v2-contract/finalize-binding/Cargo.toml
      - name: Docs
        run: |
          cargo doc --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --no-deps
          cargo doc --manifest-path crates/xenia-handshake-v2-contract/finalize-binding/Cargo.toml --no-deps

  msrv:
    name: V2 contract MSRV (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xenia-negotiation
            crates/xenia-negotiation-codec
            crates/xenia-handshake-v2-contract
            crates/xenia-handshake-v2-contract/finalize-binding
      - name: Check MSRV
        run: |
          cargo check --manifest-path crates/xenia-handshake-v2-contract/Cargo.toml --all-targets
          cargo check --manifest-path crates/xenia-handshake-v2-contract/finalize-binding/Cargo.toml --all-targets

  node:
    name: Independent V2 message/transcript reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce message and signature-transcript bytes
        run: node test-vectors/verify-handshake-v2-message-contract.mjs
