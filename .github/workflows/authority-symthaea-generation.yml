name: Xenia Symthaea Authority Generation

on:
  pull_request:
    paths:
      - "crates/xenia-authority-symthaea-generation/**"
      - ".github/workflows/authority-symthaea-generation.yml"
  push:
    branches: [main]
    paths:
      - "crates/xenia-authority-symthaea-generation/**"
      - ".github/workflows/authority-symthaea-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symthaea-authority-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation:
    name: Durable Symthaea authority generation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xenia-authority-symthaea-generation

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test generation durability and concurrency semantics
        run: cargo test --all-features
