name: One-shot Xenia resilience formatter

on:
  pull_request:
    paths:
      - "crates/xenia-resilience-evidence/src/lib.rs"
      - ".github/workflows/one-shot-xenia-resilience-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-once:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/ransomware-operator-compromise-evidence-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ransomware-operator-compromise-evidence-v1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format standalone resilience evidence crate
        run: cargo fmt --manifest-path crates/xenia-resilience-evidence/Cargo.toml
      - name: Commit formatter output and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-xenia-resilience-format.yml
          git add crates/xenia-resilience-evidence/src/lib.rs
          git config user.name "luminous-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "style(resilience): format Xenia containment evidence"
          git push origin HEAD:feat/ransomware-operator-compromise-evidence-v1
