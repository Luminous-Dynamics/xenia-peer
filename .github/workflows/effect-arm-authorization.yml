name: Effect Arm Authorization Contract

on:
  pull_request:
    paths:
      - "contracts/xenia-effect-arm-authorization/**"
      - ".github/workflows/effect-arm-authorization.yml"
  push:
    branches: [main]
    paths:
      - "contracts/xenia-effect-arm-authorization/**"
      - ".github/workflows/effect-arm-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Format + Test + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --manifest-path contracts/xenia-effect-arm-authorization/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path contracts/xenia-effect-arm-authorization/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path contracts/xenia-effect-arm-authorization/Cargo.toml --all-targets -- -D warnings

  msrv:
    name: MSRV Rust 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - name: Check
        run: cargo check --manifest-path contracts/xenia-effect-arm-authorization/Cargo.toml --all-targets
