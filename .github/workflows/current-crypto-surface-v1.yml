name: Current Crypto Surface V1

on:
  pull_request:
    paths:
      - "crates/xenia-handshake/src/lib.rs"
      - "crates/xenia-ledger/src/policy.rs"
      - "crates/xenia-ledger/src/signature.rs"
      - "crates/xenia-ledger/Cargo.toml"
      - "docs/crypto/CURRENT_CRYPTO_SURFACE_V1.md"
      - "docs/crypto/current_crypto_surface_v1.json"
      - "scripts/validate_current_crypto_surface_v1.py"
      - ".github/workflows/current-crypto-surface-v1.yml"
  push:
    branches: [main]
    paths:
      - "crates/xenia-handshake/src/lib.rs"
      - "crates/xenia-ledger/src/policy.rs"
      - "crates/xenia-ledger/src/signature.rs"
      - "crates/xenia-ledger/Cargo.toml"
      - "docs/crypto/CURRENT_CRYPTO_SURFACE_V1.md"
      - "docs/crypto/current_crypto_surface_v1.json"
      - "scripts/validate_current_crypto_surface_v1.py"
      - ".github/workflows/current-crypto-surface-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-crypto-surface:
    name: Validate scoped crypto-surface census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          git status --short

      - name: Validate current crypto surface and negative controls
        run: python3 scripts/validate_current_crypto_surface_v1.py .

      - name: Retain deterministic contract digests in log
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            docs/crypto/CURRENT_CRYPTO_SURFACE_V1.md \
            docs/crypto/current_crypto_surface_v1.json \
            scripts/validate_current_crypto_surface_v1.py

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
