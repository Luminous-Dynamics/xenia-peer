name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned (was `@stable`, a rolling tag) so rustfmt's formatting rules
      # can't drift out from under a green local `cargo fmt` between one CI
      # run and the next -- bump deliberately, alongside a `cargo fmt --all`
      # pass in the same commit, not silently.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Clippy, the full test suite, and docs all build the default-members
  # workspace, which includes the ffmpeg-backed `xenia-capture-scrcpy` crate.
  # The system libraries (ffmpeg/libav, ALSA, Opus, libclang, pkg-config) live
  # in the flake's `ci` devShell -- the single source of truth for build deps
  # -- so these jobs run inside `nix develop .#ci` rather than apt-get'ing
  # libraries in each job.
  flake-checks:
    name: Clippy + Test + Docs (flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: nix develop .#ci --command cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: nix develop .#ci --command cargo test --locked
      - name: Docs
        run: nix develop .#ci --command bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps'

  msrv:
    name: MSRV (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      # `xenia-capture-scrcpy` depends on ffmpeg (only available via the flake),
      # `sovereign-admin` is a wasm32 target, `xenia-launcher-windows` is
      # Windows-only (unconditional Win32 API usage, no `windows` crate
      # available on this Linux runner), `xenia-launcher-shell`/
      # `xenia-launcher-linux` need GTK3/libappindicator system dev headers
      # this plain runner doesn't have (tray-icon's Linux backend), and
      # `xenia-launcher-macos` is macOS-only (unconditional Objective-C
      # message-send usage, no Apple SDK/objc2 available on this Linux
      # runner); all six are excluded here so MSRV validates the minimum
      # toolchain on the portable host crates without pulling ffmpeg, a
      # Windows target, GTK dev headers, or a macOS SDK. Their own
      # toolchains are covered by flake-checks / the wasm job / the
      # windows-latest jobs / the linux-launcher job / the macos-launcher
      # job respectively.
      - run: cargo build --locked --all-targets --workspace --exclude xenia-capture-scrcpy --exclude sovereign-admin --exclude xenia-launcher-windows --exclude xenia-launcher-shell --exclude xenia-launcher-linux --exclude xenia-launcher-macos

  # Feature builds that need extra system libraries also take them from the
  # flake (ffmpeg for h264, ALSA/Opus for audio) instead of apt-get.
  features:
    name: Feature builds (h264 + audio, flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2
      - name: h264 (xenia-video + daemon + viewer)
        run: |
          nix develop .#ci --command bash -c '
            set -euo pipefail
            cargo test  --locked -p xenia-video  --features h264
            cargo build --locked -p xenia-peer   --features h264
            cargo build --locked -p xenia-viewer --features h264'
      - name: audio (capture + output + opus)
        run: |
          nix develop .#ci --command bash -c '
            set -euo pipefail
            cargo test  --locked -p xenia-peer      --features audio-capture
            cargo test  --locked -p xenia-viewer    --features audio-output
            cargo test  --locked -p xenia-peer-core --features opus
            cargo check --locked -p xenia-peer      --features audio-opus
            cargo check --locked -p xenia-viewer    --features audio-opus'

  # xenia-launcher-core has real #[cfg(windows)] process/security code
  # (OpenProcess, QueryFullProcessImageNameW, GenerateConsoleCtrlEvent,
  # TerminateProcess) that a Linux-only CI matrix would never build or run
  # -- same lesson as xenia-secure-file's own windows-latest job. Scoped to
  # just this crate for the same reason that job is: its heavier
  # workspace-mates need ffmpeg/nix-flake-only deps a plain windows-latest
  # runner doesn't have.
  windows-launcher-core:
    name: xenia-launcher-core (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p xenia-launcher-core
      - run: cargo clippy --locked -p xenia-launcher-core --all-targets -- -D warnings

  # xenia-launcher-windows is the native Windows tray shell built on top of
  # xenia-launcher-core -- unconditional (not #[cfg(windows)]-gated) Win32
  # API usage throughout, so it can only build on this runner, same
  # reasoning as windows-launcher-core just above.
  windows-launcher-windows:
    name: xenia-launcher-windows (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p xenia-launcher-windows
      - run: cargo clippy --locked -p xenia-launcher-windows --all-targets -- -D warnings
      # Real MSI installer via cargo-wix. windows-latest runner images ship
      # WiX Toolset v3 preinstalled (candle.exe/light.exe on PATH, the WIX
      # env var set) -- if that assumption is ever wrong, this step fails
      # loudly rather than silently skipping packaging.
      #
      # UNSIGNED: this repo has no purchased Windows code-signing
      # certificate. An unsigned .msi will trigger SmartScreen warnings on
      # a real user's machine -- disclosed, not fixed, until that
      # infrastructure exists. See docs/packaging/README.md.
      - run: cargo install cargo-wix --locked
      - run: cargo wix -p xenia-launcher-windows --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: xenia-launcher-windows-msi
          path: target/wix/*.msi
          if-no-files-found: error

  # xenia-launcher-linux is the native Linux tray shell -- item 8 (Linux
  # half) of the launcher plan, mirroring xenia-launcher-windows's
  # architecture. Unlike Windows, no cross-compilation is needed here: this
  # builds and runs natively on ubuntu-latest, but needs the real GTK3/
  # libappindicator/libxdo system dev headers tray-icon's Linux backend
  # requires (see that crate's own README) -- a plain runner doesn't have
  # them, hence its own job rather than folding into flake-checks.
  linux-launcher:
    name: xenia-launcher-linux (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK3/libappindicator/libxdo dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libappindicator3-dev
      - run: cargo test --locked -p xenia-launcher-shell -p xenia-launcher-linux
      - run: cargo clippy --locked -p xenia-launcher-shell -p xenia-launcher-linux --all-targets -- -D warnings
      # Real .deb package via cargo-deb. `depends = "$auto"` in that
      # crate's Cargo.toml resolves runtime library deps (GTK3/
      # libappindicator/libxdo) via dpkg-shlibdeps against the real
      # apt-installed -dev packages above -- verified locally this comes
      # back empty on NixOS (Nix store libs aren't in dpkg's shlibs
      # database), so this ubuntu-latest run is the authoritative check
      # that auto-detection actually resolves real package names here.
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p xenia-launcher-linux -v
      - uses: actions/upload-artifact@v4
        with:
          name: xenia-launcher-linux-deb
          path: target/debian/*.deb
          if-no-files-found: error

  # xenia-launcher-macos is the native macOS tray shell -- item 8 (macOS
  # half) of the launcher plan. Unlike Windows (cargo-xwin cross-compiles
  # against a freely redistributable MSVC subset) or Linux (builds
  # natively, just needs GTK headers), there is no freely-redistributable
  # way to get a real Apple SDK/linker on a non-Mac host -- this crate was
  # developed and iterated entirely against `cargo check --target
  # x86_64-apple-darwin` (type-check only, no link -- see the crate's own
  # module doc comments for exactly what that does and doesn't verify).
  # This job, on a real macos-latest runner with a real Xcode/SDK, is the
  # FIRST point in this whole effort where the code actually links and
  # runs its test suite for real.
  macos-launcher:
    name: xenia-launcher-macos (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p xenia-launcher-macos
      - run: cargo clippy --locked -p xenia-launcher-macos --all-targets -- -D warnings
      # Real .app bundle, assembled by hand (no cargo-bundle/cargo-packager
      # dependency -- a bundle is just a directory structure + Info.plist,
      # no tool is strictly needed). UNSIGNED and UNNOTARIZED -- see
      # docs/packaging/README.md for why, and for the real, disclosed
      # consequence: Gatekeeper will refuse to open this via a normal
      # double-click on a fresh machine.
      - name: Build release binary
        run: cargo build --locked --release -p xenia-launcher-macos
      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP="target/release/Xenia Launcher.app"
          mkdir -p "$APP/Contents/MacOS"
          cp apps/xenia-launcher-macos/packaging/Info.plist "$APP/Contents/Info.plist"
          cp target/release/xenia-launcher "$APP/Contents/MacOS/xenia-launcher"
          chmod +x "$APP/Contents/MacOS/xenia-launcher"
          cd target/release
          zip -r -y xenia-launcher-macos.zip "Xenia Launcher.app"
      - uses: actions/upload-artifact@v4
        with:
          name: xenia-launcher-macos-app
          path: target/release/xenia-launcher-macos.zip
          if-no-files-found: error
