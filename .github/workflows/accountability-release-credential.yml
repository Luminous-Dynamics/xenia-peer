name: Accountability Release Credential

on:
  pull_request:
    paths:
      - "crates/xenia-ledger/**"
      - ".github/workflows/accountability-release-credential.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Ledger tests
        run: cargo test --locked -p xenia-ledger --lib --no-fail-fast
      - name: Ledger clippy
        run: cargo clippy --locked -p xenia-ledger --all-targets -- -D warnings
