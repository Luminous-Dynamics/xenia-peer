name: Operator Rekey Initiator Conformance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "apps/xenia-peer/Cargo.toml"
      - "apps/xenia-peer/src/operator_rekey_initiator.rs"
      - "apps/xenia-peer/src/operator_rekey_transport.rs"
      - "apps/xenia-peer/src/operator_sealed_channel.rs"
      - "apps/xenia-peer/src/operator_sealed_channel_legacy.rs"
      - "apps/xenia-peer/src/operator_sealed_channel_adversarial_tests.rs"
      - "apps/xenia-peer/src/operator_channel_metrics.rs"
      - "crates/xenia-peer-core/src/transport.rs"
      - "docs/security/OPERATOR_REKEY_INVARIANTS_V1.json"
      - "scripts/check_operator_rekey_state_model.py"
      - ".github/workflows/operator-rekey-initiator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-rekey-initiator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  QUALIFICATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-source-transaction:
    name: Exact source transport transaction
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4, pinned so exact-head qualification cannot silently
      # change behavior while the Xenia source commit remains identical.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Validate security invariant registry
        shell: python
        run: |
          import json
          from pathlib import Path

          registry_path = Path("docs/security/OPERATOR_REKEY_INVARIANTS_V1.json")
          data = json.loads(registry_path.read_text())
          assert data["schema"] == "xenia.operator-rekey-invariants.v1"
          assert data["qualification_workflow"] == "Operator Rekey Initiator Conformance"

          invariants = data["invariants"]
          ids = [entry["id"] for entry in invariants]
          assert len(ids) == len(set(ids)), "duplicate operator-rekey invariant id"
          assert ids == [f"ORI-{index:03d}" for index in range(1, len(ids) + 1)], (
              "operator-rekey invariant IDs must stay contiguous and reviewable"
          )
          invariant_ids = set(ids)

          models = {}
          for model in data.get("independent_models", []):
              model_id = model["id"]
              assert model_id not in models, f"duplicate independent model id: {model_id}"
              assert Path(model["source"]).exists(), f"missing model source: {model['source']}"
              assert model["report_schema"].strip(), f"{model_id} missing report schema"
              assert model["bounded_max_depth"] > 0, f"{model_id} has invalid depth"
              supports = model["supports"]
              assert supports, f"{model_id} supports no invariants"
              assert set(supports) <= invariant_ids, f"{model_id} references unknown invariant"
              models[model_id] = model

          allowed = {"pending_hosted_execution", "blocked_on_final_wire_lineage"}
          rust_source = "\n".join(
              path.read_text(errors="replace")
              for path in Path("apps/xenia-peer/src").rglob("*.rs")
          )
          referenced_models = set()
          for entry in invariants:
              assert entry["property"].strip(), f"{entry['id']} missing property"
              assert entry["source"].strip(), f"{entry['id']} missing source"
              assert entry["qualification"] in allowed, (
                  f"{entry['id']} has unsupported qualification state"
              )
              evidence = entry["evidence"]
              assert evidence, f"{entry['id']} has no evidence mapping"
              if entry["source"] != "cross-repository":
                  assert Path(entry["source"]).exists(), (
                      f"{entry['id']} source path does not exist: {entry['source']}"
                  )
              for selector in evidence:
                  if selector.startswith("future:"):
                      assert entry["qualification"] == "blocked_on_final_wire_lineage"
                      continue
                  if selector.startswith("model:"):
                      model_id = selector.split(":", 1)[1]
                      assert model_id in models, f"{entry['id']} references unknown model {model_id}"
                      assert entry["id"] in models[model_id]["supports"], (
                          f"{model_id} does not declare support for {entry['id']}"
                      )
                      referenced_models.add(model_id)
                      continue
                  terminal = selector.rsplit("::", 1)[-1]
                  if terminal == "tests":
                      continue
                  assert f"fn {terminal}(" in rust_source, (
                      f"{entry['id']} evidence selector has no matching Rust test: {selector}"
                  )

          assert referenced_models == set(models), "declared independent model is not evidence-bound"
          print(
              f"validated {len(invariants)} operator-rekey invariants and "
              f"{len(models)} independent model(s)"
          )

      - name: Run independent bounded state model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          python3 scripts/check_operator_rekey_state_model.py \
            --max-depth 9 \
            --json-out "$RUNNER_TEMP/qualification/OPERATOR_REKEY_STATE_MODEL.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "qualification" / "OPERATOR_REKEY_STATE_MODEL.json").read_text()
          )
          assert report["schema"] == "xenia.operator-rekey-state-model-report.v1"
          assert report["max_depth"] == 9
          assert report["checked_trace_prefixes"] > report["reachable_state_count"]
          assert len(report["state_graph_sha256"]) == 64
          PY

      # DeterminateSystems/nix-installer-action main as observed 2026-09-01,
      # pinned to an immutable verified commit rather than mutable @main.
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      # Swatinem/rust-cache v2.9.2 signed tag -> immutable commit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Retain dependency, workflow, runner, model, and toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          cp Cargo.lock "$RUNNER_TEMP/qualification/Cargo.lock"
          cp docs/security/OPERATOR_REKEY_INVARIANTS_V1.json "$RUNNER_TEMP/qualification/"
          cp scripts/check_operator_rekey_state_model.py "$RUNNER_TEMP/qualification/"
          cp .github/workflows/operator-rekey-initiator.yml "$RUNNER_TEMP/qualification/"
          {
            echo "profile=xenia-operator-rekey-initiator-v1"
            echo "source_head=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "runner_label=ubuntu-24.04"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -srmo)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "flake_lock_sha256=$(sha256sum flake.lock | awk '{print $1}')"
            echo "invariants_sha256=$(sha256sum docs/security/OPERATOR_REKEY_INVARIANTS_V1.json | awk '{print $1}')"
            echo "state_model_source_sha256=$(sha256sum scripts/check_operator_rekey_state_model.py | awk '{print $1}')"
            echo "state_model_report_sha256=$(sha256sum \"$RUNNER_TEMP/qualification/OPERATOR_REKEY_STATE_MODEL.json\" | awk '{print $1}')"
            echo "qualification_workflow_sha256=$(sha256sum .github/workflows/operator-rekey-initiator.yml | awk '{print $1}')"
            echo "actions_checkout_commit=11d5960a326750d5838078e36cf38b85af677262"
            echo "nix_installer_action_commit=33c9ab3ef95cd57c164d9d6eb1f9a46338538d41"
            echo "rust_cache_action_commit=6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
            echo "upload_artifact_action_commit=ea165f8d65b6e75b540449e92b4886f43607fa02"
            echo "rust_toolchain_action_commit=6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772"
            echo "--- host os-release ---"
            cat /etc/os-release
            echo "--- nix ---"
            nix --version
            echo "--- nix ci rustc ---"
            nix develop .#ci --command rustc -vV
            echo "--- nix ci cargo ---"
            nix develop .#ci --command cargo -Vv
          } > "$RUNNER_TEMP/qualification/PROVENANCE.txt"
          cat "$RUNNER_TEMP/qualification/PROVENANCE.txt"

      - name: Format exact source
        run: nix develop .#ci --command cargo fmt --all -- --check

      - name: Check daemon boundary
        run: nix develop .#ci --command cargo check --locked -p xenia-peer --all-targets

      - name: Clippy daemon boundary
        run: nix develop .#ci --command cargo clippy --locked -p xenia-peer --all-targets -- -D warnings

      - name: Rekey initiator state tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_sealed_channel::initiator::tests'

      - name: Rekey transport transaction tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_sealed_channel::rekey_transport::tests'

      - name: Live adversarial endpoint tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_sealed_channel::adversarial_tests'

      - name: Operator protocol metrics tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_channel_metrics::tests'

      - name: Assert source tree remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "final_source_tree=$(git rev-parse HEAD^{tree})" >> "$RUNNER_TEMP/qualification/PROVENANCE.txt"

      - name: Retain qualification capsule
        if: always()
        # actions/upload-artifact v4, immutable pin.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-rekey-initiator-${{ env.QUALIFICATION_SOURCE_SHA }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
          retention-days: 90

  msrv:
    name: Rust 1.94 daemon boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          persist-credentials: false
      # Pin action implementation separately from the requested toolchain.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Record MSRV toolchain
        run: |
          rustc -vV
          cargo -Vv
      - run: cargo check --locked -p xenia-peer --all-targets
