name: Operator Rekey Initiator Conformance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "apps/xenia-peer/Cargo.toml"
      - "apps/xenia-peer/src/operator_rekey_initiator.rs"
      - "apps/xenia-peer/src/operator_rekey_transport.rs"
      - "apps/xenia-peer/src/operator_sealed_channel.rs"
      - "apps/xenia-peer/src/operator_sealed_channel_legacy.rs"
      - "apps/xenia-peer/src/operator_sealed_channel_adversarial_tests.rs"
      - "apps/xenia-peer/src/operator_channel_metrics.rs"
      - "crates/xenia-peer-core/src/transport.rs"
      - "docs/security/OPERATOR_REKEY_INVARIANTS_V1.json"
      - ".github/workflows/operator-rekey-initiator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-rekey-initiator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  QUALIFICATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-source-transaction:
    name: Exact source transport transaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert immutable source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Validate security invariant registry
        shell: python
        run: |
          import json
          from pathlib import Path

          registry_path = Path("docs/security/OPERATOR_REKEY_INVARIANTS_V1.json")
          data = json.loads(registry_path.read_text())
          assert data["schema"] == "xenia.operator-rekey-invariants.v1"
          assert data["qualification_workflow"] == "Operator Rekey Initiator Conformance"

          invariants = data["invariants"]
          ids = [entry["id"] for entry in invariants]
          assert len(ids) == len(set(ids)), "duplicate operator-rekey invariant id"
          assert ids == [f"ORI-{index:03d}" for index in range(1, len(ids) + 1)], (
              "operator-rekey invariant IDs must stay contiguous and reviewable"
          )

          allowed = {"pending_hosted_execution", "blocked_on_final_wire_lineage"}
          rust_source = "\n".join(
              path.read_text(errors="replace")
              for path in Path("apps/xenia-peer/src").rglob("*.rs")
          )
          for entry in invariants:
              assert entry["property"].strip(), f"{entry['id']} missing property"
              assert entry["source"].strip(), f"{entry['id']} missing source"
              assert entry["qualification"] in allowed, (
                  f"{entry['id']} has unsupported qualification state"
              )
              evidence = entry["evidence"]
              assert evidence, f"{entry['id']} has no evidence mapping"
              if entry["source"] != "cross-repository":
                  assert Path(entry["source"]).exists(), (
                      f"{entry['id']} source path does not exist: {entry['source']}"
                  )
              for selector in evidence:
                  if selector.startswith("future:"):
                      assert entry["qualification"] == "blocked_on_final_wire_lineage"
                      continue
                  terminal = selector.rsplit("::", 1)[-1]
                  if terminal == "tests":
                      continue
                  assert f"fn {terminal}(" in rust_source, (
                      f"{entry['id']} evidence selector has no matching Rust test: {selector}"
                  )

          print(f"validated {len(invariants)} operator-rekey invariants")

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: Swatinem/rust-cache@v2

      - name: Retain dependency and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          cp Cargo.lock "$RUNNER_TEMP/qualification/Cargo.lock"
          cp docs/security/OPERATOR_REKEY_INVARIANTS_V1.json "$RUNNER_TEMP/qualification/"
          {
            echo "profile=xenia-operator-rekey-initiator-v1"
            echo "source_head=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "flake_lock_sha256=$(sha256sum flake.lock | awk '{print $1}')"
            echo "invariants_sha256=$(sha256sum docs/security/OPERATOR_REKEY_INVARIANTS_V1.json | awk '{print $1}')"
          } > "$RUNNER_TEMP/qualification/PROVENANCE.txt"
          cat "$RUNNER_TEMP/qualification/PROVENANCE.txt"

      - name: Format exact source
        run: nix develop .#ci --command cargo fmt --all -- --check

      - name: Check daemon boundary
        run: nix develop .#ci --command cargo check --locked -p xenia-peer --all-targets

      - name: Clippy daemon boundary
        run: nix develop .#ci --command cargo clippy --locked -p xenia-peer --all-targets -- -D warnings

      - name: Rekey initiator state tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_sealed_channel::initiator::tests'

      - name: Rekey transport transaction tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_sealed_channel::rekey_transport::tests'

      - name: Live adversarial endpoint tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_sealed_channel::adversarial_tests'

      - name: Operator protocol metrics tests
        run: nix develop .#ci --command cargo test --locked -p xenia-peer 'operator_channel_metrics::tests'

      - name: Assert source tree remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "final_source_tree=$(git rev-parse HEAD^{tree})" >> "$RUNNER_TEMP/qualification/PROVENANCE.txt"

      - name: Retain qualification capsule
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-rekey-initiator-${{ env.QUALIFICATION_SOURCE_SHA }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
          retention-days: 90

  msrv:
    name: Rust 1.94 daemon boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p xenia-peer --all-targets
