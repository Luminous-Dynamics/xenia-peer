name: Xenia Symthaea Attestation Verifier

on:
  pull_request:
    paths:
      - "crates/xenia-authority-symthaea-attestation-contract/**"
      - "crates/xenia-authority-symthaea-attestation-verifier/**"
      - ".github/workflows/authority-symthaea-attestation-verifier.yml"
  push:
    branches: [main]
    paths:
      - "crates/xenia-authority-symthaea-attestation-contract/**"
      - "crates/xenia-authority-symthaea-attestation-verifier/**"
      - ".github/workflows/authority-symthaea-attestation-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symthaea-attestation-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Symthaea hybrid attestation verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xenia-authority-symthaea-attestation-verifier

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test real hybrid verification
        run: cargo test --all-features
