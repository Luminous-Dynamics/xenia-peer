name: Xenia M1 Runtime Smoke

on:
  pull_request:
    paths-ignore:
      # Experimental protocol-contract crates are deliberately outside the
      # production workspace and have dedicated evidence lanes. Remove these
      # exemptions when any contract becomes production runtime code.
      - "crates/xenia-negotiation/**"
      - "crates/xenia-negotiation-codec/**"
      - "crates/xenia-handshake-v2-contract/**"
      - "crates/xenia-authority-*/**"
      - ".github/workflows/negotiated-context.yml"
      - ".github/workflows/negotiation-policy.yml"
      - ".github/workflows/handshake-v2-contract.yml"
      - ".github/workflows/authority-*.yml"
  push:
    branches: [main]

jobs:
  m1-runtime-smoke:
    name: M1 runtime smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run M1 runtime smoke
        run: scripts/xenia-m1-runtime-smoke.sh .