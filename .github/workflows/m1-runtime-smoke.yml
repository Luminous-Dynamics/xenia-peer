name: Xenia M1 Runtime Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  m1-runtime-smoke:
    name: M1 runtime smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run M1 runtime smoke
        run: scripts/xenia-m1-runtime-smoke.sh .
