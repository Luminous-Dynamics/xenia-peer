name: Xenia Symthaea Live Authority Guard

on:
  pull_request:
    paths:
      - "crates/xenia-authority-symthaea-live-guard/**"
      - ".github/workflows/authority-symthaea-live-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-guard:
    name: Pre/post-change fail-closed authority guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xenia-authority-symthaea-live-guard
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test fail-closed mutation semantics
        run: cargo test --all-features
