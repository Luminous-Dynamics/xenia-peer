name: Xenia Validate

on:
  pull_request:
    paths-ignore:
      # Experimental protocol-contract crates are deliberately outside the
      # production workspace and have dedicated Rust/MSRV/Node evidence lanes.
      # Remove these exemptions in the same PR that integrates any of them into
      # production workspace/runtime code.
      - "crates/xenia-negotiation/**"
      - "crates/xenia-negotiation-codec/**"
      - "crates/xenia-handshake-v2-contract/**"
      - "crates/xenia-authority-*/**"
      - ".github/workflows/negotiated-context.yml"
      - ".github/workflows/negotiation-policy.yml"
      - ".github/workflows/handshake-v2-contract.yml"
      - ".github/workflows/authority-*.yml"
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly deep VM test (see network-vm job below) -- Sundays 07:00 UTC,
    # offset an hour from xenia-wire's fuzz-deep schedule.
    - cron: "0 7 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Script syntax
        run: |
          if [ -d scripts ]; then
            find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
            find scripts -type f -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
          fi
      - name: Xenia validation
        run: |
          chmod +x scripts/*.sh scripts/*.py || true
          scripts/xenia-validate.sh .
      - name: Ledger PQC signature feature
        run: |
          cargo test --locked -p xenia-ledger --features pqc-signatures --lib --no-fail-fast
      - name: Peer PQC verifier feature
        run: |
          cargo test --locked -p xenia-peer --features pqc-signatures --no-fail-fast

  # Tier 0 of the network-reliability testing plan: proves a real
  # xenia-peer daemon <-> xenia-viewer session survives packet loss,
  # latency, jitter, and reordering using network namespaces + `tc
  # netem` -- no VM needed, cheap enough to run on every push/PR.
  # ubuntu-latest ships iproute2 (`ip`/`tc`) and passwordless sudo for
  # the runner user already, so no extra setup is needed beyond
  # checkout. Building the script found and fixed three real bugs (see
  # scripts/xenia-network-chaos-smoke.sh's own comments): a doubled
  # path prefix, a TCP-connect probe that crashed the single-session
  # daemon, and a "harsh" profile whose failures were a genuine finding
  # (passthrough codec needs ~180 TCP segments/frame, so 15% loss makes
  # nearly every frame need retransmission) rather than a script bug --
  # dialed back to a CI-stable severity rather than hidden with a
  # longer timeout.
  network-chaos:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: network-chaos-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            network-chaos-cargo-${{ runner.os }}-
      - name: Network chaos smoke test
        run: |
          chmod +x scripts/*.sh
          scripts/xenia-network-chaos-smoke.sh .

  # Availability regression guard (THREAT_MODEL.md §Availability, and F1 in
  # docs/roadmap/XENIA_COMPREHENSIVE_REVIEW_2026-07-28.md): a peer that
  # connects and never completes the handshake must not stop a legitimate
  # viewer from getting a session. Cheaper than network-chaos above -- pure
  # loopback, no namespaces, no sudo, no compositor -- so it runs on every
  # push/PR too. Asserts end-to-end (a real verified viewer session while the
  # stalled peer is still attached), not just that a timeout was logged,
  # because a deadline without the accept-retry would still be a DoS.
  stalled-peer:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: stalled-peer-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stalled-peer-cargo-${{ runner.os }}-
      - name: Stalled-peer availability smoke test
        run: |
          chmod +x scripts/*.sh
          scripts/xenia-stalled-peer-smoke.sh .


  # `flake.nix` is always present in this repo, so this job runs
  # unconditionally -- it used to guard on `if: hashFiles('flake.nix') !=
  # ''`, but `hashFiles()` is only a valid expression in step-level
  # contexts (`jobs.<id>.steps.*`), not job-level `if:`. GitHub rejects
  # the *entire workflow file* when any job's `if:` uses a
  # context/function it isn't valid in, which is why this workflow had
  # been silently producing zero jobs ("this run likely failed because of
  # a workflow file issue") on every push for days -- found live while
  # verifying the new `e2e` job below actually ran in CI.
  nix:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix flake check
        run: nix flake check --show-trace
      - name: Validate inside Nix CI shell
        run: nix develop .#ci -c bash scripts/xenia-validate.sh .

  # A4 of docs/roadmap/XENIA_EXPANSION_PLAN_REVIEW_2026-07-29.md.
  #
  # `scap-backend` is Xenia's PRIMARY capture backend per ADR-0001, and until
  # this job existed **no workflow compiled it at all** -- the flake pins its
  # outputHash only so the git dependency resolves, and every other job builds
  # with the feature off. The consequences were not hypothetical: the Linux
  # engine break and the Windows `Frame::timespan()` -> `timestamp()` break
  # were both found by hand, months apart, by someone happening to compile it.
  #
  # `--all-targets` is load-bearing, not thoroughness for its own sake:
  # `capture_bench` is an `[[example]]` gated behind
  # `required-features = ["scap-backend"]`, so a plain `cargo check -p
  # xenia-capture` never sees it -- and it is the one target that drives the
  # capture API the way a real consumer does.
  #
  # `--no-run` builds the test binaries without executing them. That is
  # deliberate: a headless runner has no compositor and no xdg-desktop-portal,
  # so *running* capture would fail for environmental reasons and tell us
  # nothing. This job proves the code compiles against real libpipewire/libspa
  # headers; live capture validation stays manual (see ROADMAP.md B2).
  #
  # Needs the nix devshell for libpipewire-0.3 + libspa-0.2 + libdbus-1 dev
  # headers; `.#ci` carries the same system libraries as `.#default`.
  scap-backend:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: scap-backend-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            scap-backend-cargo-${{ runner.os }}-
      - name: Compile the scap capture backend (lib + example + tests)
        run: |
          nix develop .#ci -c cargo test --no-run --all-targets \
            -p xenia-capture --features scap-backend

  # Item 6 of docs/security/POST_DELEGATION_HARDENING_PLAN.md: the real
  # browser-driven vertical slice -- launches the actual xenia-peer daemon,
  # xenia-operator-agent, xenia-viewer, and the compiled sovereign-admin
  # console under a headless Playwright browser and proves all 13 numbered
  # properties end-to-end (pairing, JSON-path enrollment, operator auth,
  # native host-trust approval, the hybrid sealed handshake, consent,
  # frame/input gating, rekey, revocation, changed-identity refusal,
  # restart recovery, and no durable secrets in browser storage). Every
  # build step here is a genuine cold compile per CI run (no persistent
  # cache across runs in this job, only within one run via actions/cache);
  # if that turns out too slow/flaky for every PR, tune it (e.g. a
  # dedicated cache key, or gate to a label) rather than dropping it from
  # CI -- this is the one test in the repo that actually proves the
  # browser console works against a live daemon, not a mock.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ runner.os }}-
      - name: Real browser-driven vertical slice
        run: nix develop .#e2e -c bash scripts/xenia-e2e-vertical-slice.sh .
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: /tmp/xenia-e2e-vertical-slice/
          if-no-files-found: ignore

  # `xenia-wire/` isn't currently checked into this repo (unlike
  # `flake.nix`, which always is -- see the `nix`/`e2e` jobs above for why
  # this can't be a job-level `if: hashFiles(...)` any more), so this job
  # genuinely needs a real existence check. Done as a step-level guard
  # instead: `hashFiles()` (and any expression) is only valid inside
  # `jobs.<id>.steps.*`, so the check itself becomes a step whose output
  # later steps gate on, rather than a job-level `if:`.
  xenia-wire:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Check xenia-wire exists
        id: check
        run: |
          if [ -f xenia-wire/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        if: steps.check.outputs.exists == 'true'
        # Pinned (was `@stable`) for the same reason as ci.yml's Format
        # Check job -- this step runs `cargo fmt --all -- --check` too, so
        # it shares the same rolling-toolchain drift risk.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Check xenia-wire
        if: steps.check.outputs.exists == 'true'
        run: |
          cd xenia-wire
          cargo metadata --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo test --all-features

  # Tier 1 of the network-reliability testing plan: two genuinely
  # separate NixOS VMs (distinct kernels/network stacks, unlike Tier 0's
  # shared-kernel network-namespace approach in network-chaos above),
  # proving a real cross-machine session and that the daemon's identity
  # survives a hard VM reboot rather than a mere process restart. See
  # flake.nix's checks.network-vm for the full test script and the two
  # real bugs found while building it.
  #
  # Weekly + manual-dispatch only, not every push/PR: standard
  # GitHub-hosted runners don't expose /dev/kvm, so this nixosTest runs
  # under QEMU's software emulation (TCG) rather than KVM-accelerated --
  # untested here how much slower that makes it versus the ~105s
  # test-script runtime measured locally (with KVM). Kept off the
  # every-push path until that's known, rather than risk flaking every
  # PR on an unverified timing assumption.
  network-vm:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache cargo registry and Nix store paths
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: network-vm-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            network-vm-cargo-${{ runner.os }}-
      - name: Run the 2-VM network reliability test
        run: nix build .#checks.x86_64-linux.network-vm -L

  # Coverage-guided fuzzing over fuzz/'s three targets (see fuzz/README.md):
  # fuzz_agent_request and fuzz_evidence_verify (xenia-operator-agent's
  # attacker-facing DTOs) plus fuzz_wire_decode (xenia-peer-core's
  # attacker-controlled decode surface: HandshakeMessage -- the pre-auth
  # handshake enum -- plus RawFrame/RawInput/TransportAdvertisement/
  # RawCapabilities). Weekly + manual-dispatch only, same reasoning as
  # network-vm above: this is deliberately bounded (5 min/target, not
  # continuous), added because the fuzz crate existed but had never
  # actually been wired into CI anywhere -- this workflow's own schedule
  # comment referenced "xenia-wire's fuzz-deep schedule" without this repo
  # having an equivalent job of its own.
  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # fuzz/Cargo.lock is gitignored (see fuzz/.gitignore -- standard
          # cargo-fuzz convention, deliberately unpinned) so it won't exist
          # in a fresh checkout to hash. fuzz/Cargo.toml plus the workspace
          # Cargo.lock (fuzz's path deps live in the main workspace) is the
          # closest available proxy for "fuzz's dependency set changed."
          key: fuzz-cargo-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            fuzz-cargo-${{ runner.os }}-
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz fuzz_agent_request
        run: cd fuzz && cargo +nightly fuzz run fuzz_agent_request -- -max_total_time=300
      - name: Fuzz fuzz_evidence_verify
        run: cd fuzz && cargo +nightly fuzz run fuzz_evidence_verify -- -max_total_time=300
      - name: Fuzz fuzz_wire_decode
        run: cd fuzz && cargo +nightly fuzz run fuzz_wire_decode -- -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
