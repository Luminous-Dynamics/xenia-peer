name: Xenia Artifact Attestation Contract

on:
  pull_request:
    paths:
      - "crates/xenia-artifact-attestation/**"
      - ".github/workflows/authority-artifact-attestation.yml"
  push:
    branches: [main]
    paths:
      - "crates/xenia-artifact-attestation/**"
      - ".github/workflows/authority-artifact-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Canonical hybrid artifact attestation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xenia-artifact-attestation

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test frozen vectors and substitution adversaries
        run: cargo test --all-features

      - name: wasm32 portability
        run: cargo check --all-features --target wasm32-unknown-unknown
