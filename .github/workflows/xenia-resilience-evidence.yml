name: Xenia Resilience Evidence

on:
  pull_request:
    paths:
      - "crates/xenia-resilience-evidence/**"
      - "docs/resilience/**"
      - ".github/workflows/xenia-resilience-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xenia-resilience-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Format + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/xenia-resilience-evidence/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/xenia-resilience-evidence/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/xenia-resilience-evidence/Cargo.toml --all-targets -- -D warnings

  msrv:
    name: MSRV (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - run: cargo test --manifest-path crates/xenia-resilience-evidence/Cargo.toml
