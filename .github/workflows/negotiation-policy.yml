name: Negotiation Policy Conformance

on:
  pull_request:
    paths:
      - "crates/xenia-negotiation/**"
      - "crates/xenia-negotiation-policy/**"
      - "test-vectors/negotiation-policy-v1.json"
      - "test-vectors/verify-negotiation-policy.mjs"
      - ".github/workflows/negotiation-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: negotiation-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Local policy (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xenia-negotiation
            crates/xenia-negotiation-policy
      - name: Format
        run: cargo fmt --manifest-path crates/xenia-negotiation-policy/Cargo.toml --check
      - name: Check
        run: cargo check --manifest-path crates/xenia-negotiation-policy/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/xenia-negotiation-policy/Cargo.toml --all-targets -- -D warnings
      - name: Test policy downgrade and allow-list rules
        run: cargo test --manifest-path crates/xenia-negotiation-policy/Cargo.toml
      - name: Docs
        run: cargo doc --manifest-path crates/xenia-negotiation-policy/Cargo.toml --no-deps

  msrv:
    name: Local policy MSRV (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xenia-negotiation
            crates/xenia-negotiation-policy
      - name: Check MSRV
        run: cargo check --manifest-path crates/xenia-negotiation-policy/Cargo.toml --all-targets

  node:
    name: Independent policy vector reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce canonical policy SHA-256 vectors
        run: node test-vectors/verify-negotiation-policy.mjs
