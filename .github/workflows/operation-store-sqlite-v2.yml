name: Operation Store SQLite V2

on:
  push:
    branches:
      - "feat/operation-store-sqlite-v2"
    paths:
      - "experimental/xenia-operation-store-sqlite-v2/**"
      - "contracts/xenia-operation-authority-epoch/**"
      - "contracts/xenia-operation-authority-v2/**"
      - "contracts/xenia-operation-admission-proof-v2/**"
      - "contracts/xenia-operation-receipt-finalization/**"
      - "docs/ADR-019-sqlite-operation-store-v2.md"
      - "docs/ADR-020-sqlite-v2-crash-qualification.md"
      - "docs/ADR-021-sqlite-engine-recovery-boundary.md"
      - ".github/workflows/operation-store-sqlite-v2.yml"
  pull_request:
    paths:
      - "experimental/xenia-operation-store-sqlite-v2/**"
      - "contracts/xenia-operation-authority-epoch/**"
      - "contracts/xenia-operation-authority-v2/**"
      - "contracts/xenia-operation-admission-proof-v2/**"
      - "contracts/xenia-operation-receipt-finalization/**"
      - "docs/ADR-019-sqlite-operation-store-v2.md"
      - "docs/ADR-020-sqlite-v2-crash-qualification.md"
      - "docs/ADR-021-sqlite-engine-recovery-boundary.md"
      - ".github/workflows/operation-store-sqlite-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy

      - name: Apply deterministic source hardening
        run: python3 experimental/xenia-operation-store-sqlite-v2/apply_qualification_hardening.py

      - name: Assert hardened authority/store/recovery mapping
        shell: bash
        run: |
          set -euo pipefail
          file=experimental/xenia-operation-store-sqlite-v2/src/lib.rs
          cargo=experimental/xenia-operation-store-sqlite-v2/Cargo.toml
          ! grep -F 'reserved compatibility field keeps explicit column count stable in this draft' "$file"
          ! grep -F 'Keep a single obvious mapping error' "$file"
          grep -F 'grant_authority_bytes BLOB NOT NULL' "$file"
          grep -F 'INSERT INTO admissions(' "$file"
          grep -F 'grant_authority_digest, grant_authority_bytes, raw_use_digest' "$file"
          grep -F 'grant: &GrantAuthorityV2' "$file"
          grep -F 'authenticated_issuance: AuthenticatedIssuanceContextV2' "$file"
          grep -F 'admission.validate_against(' "$file"
          grep -F 'OpenFlags::SQLITE_OPEN_READ_ONLY' "$file"
          grep -F 'fn run_sqlite_engine_recovery(' "$file"
          grep -F 'PRAGMA schema_version' "$file"
          grep -F 'QUALIFIED_SQLITE_VERSION_V2: &str = "3.53.4"' "$file"
          grep -F 'bf7c7f30031888f4e796e429ab3978879485813aaca6f641c7b33e4e09459bcc' "$file"
          grep -F 'RecoveryDatabaseMissing' "$file"
          grep -F 'SQLiteSourceProfileMismatch' "$file"
          grep -F 'EngineRecoveryFailed' "$file"
          grep -F 'StoredReceiptRowMismatch' "$file"
          grep -F 'fn unauthenticated_issuance_cannot_reach_durable_admission' "$file"
          grep -F 'fn receipt_cannot_bind_forged_same_id_admission' "$file"
          grep -F 'fn corrupted_admission_auxiliary_column_fails_local_integrity' "$file"
          grep -F 'fn corrupted_receipt_digest_column_fails_local_integrity' "$file"
          grep -F 'fn stale_marker_with_missing_database_never_creates_replacement_store' "$file"
          grep -F 'fn recovery_required_open_does_not_change_database_bytes' "$file"
          grep -F 'fn recovery_journal_symlink_is_rejected_before_engine_recovery' "$file"
          grep -F 'fn recovery_journal_hard_link_is_rejected_before_engine_recovery' "$file"
          grep -F 'fn recovery_journal_wrong_mode_is_rejected_before_engine_recovery' "$file"
          grep -F 'fn qualified_sqlite_source_profile_is_exact' "$file"
          grep -F 'fn corrupted_store_cannot_claim_clean_close' "$file"
          grep -F 'fn verify_frontier_semantics(&self)' "$file"
          grep -F 'FrontierMutationCardinalityMismatch' "$file"
          grep -F 'qualification_crash_point("admission", "C9")' "$file"
          grep -F 'qualification_crash_point("effect-armed", "C9")' "$file"
          grep -F 'a8f0a07bf65b28c05fa54b260d39707368ad9ed3' "$cargo"
          test -f experimental/xenia-operation-store-sqlite-v2/run_destructive_qualification.sh
          test -f experimental/xenia-operation-store-sqlite-v2/verify_production_crash_surface.sh
          test -f experimental/xenia-operation-store-sqlite-v2/verify_qualification_artifact.sh
          test -f experimental/xenia-operation-store-sqlite-v2/QUALIFICATION_EVIDENCE.md
          test -f experimental/xenia-operation-store-sqlite-v2/src/bin/sqlite_profile_probe.rs

      - name: Resolve standalone lock and dependency identity
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: |
          cargo generate-lockfile
          sha256sum Cargo.lock
          cargo tree -p rusqlite | head -n 120
          cargo tree -p libsqlite3-sys | head -n 120
          grep -F 'a8f0a07bf65b28c05fa54b260d39707368ad9ed3' Cargo.lock

      - name: Format candidate
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: cargo fmt

      - name: Diff hygiene
        run: git diff --check

      - name: Production-feature unit tests
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: cargo test --locked

      - name: Production-feature strict Clippy
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Crash-qualification feature build and Clippy
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: |
          cargo build --locked --features crash-injection --bin store_crash_probe
          cargo clippy --locked --all-targets --features crash-injection -- -D warnings

      - name: Retained ADR-020/ADR-021 destructive qualification
        working-directory: experimental/xenia-operation-store-sqlite-v2
        shell: bash
        run: bash ./run_destructive_qualification.sh "$RUNNER_TEMP/sqlite-v2-qualification"

      - name: Package evidence schema and verifier
        if: always()
        working-directory: experimental/xenia-operation-store-sqlite-v2
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sqlite-v2-qualification"
          mkdir -p "$evidence"
          cp QUALIFICATION_EVIDENCE.md "$evidence/QUALIFICATION_EVIDENCE.md"
          cp verify_qualification_artifact.sh "$evidence/verify_qualification_artifact.sh"

      - name: Verify production crash surface
        if: always()
        working-directory: experimental/xenia-operation-store-sqlite-v2
        shell: bash
        run: bash ./verify_production_crash_surface.sh "$RUNNER_TEMP/sqlite-v2-qualification"

      - name: Self-verify complete qualification artifact
        working-directory: experimental/xenia-operation-store-sqlite-v2
        shell: bash
        run: bash "$RUNNER_TEMP/sqlite-v2-qualification/verify_qualification_artifact.sh" "$RUNNER_TEMP/sqlite-v2-qualification"

      - name: Upload SQLite V2 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-v2-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-v2-qualification
          if-no-files-found: warn
          retention-days: 30

      - name: Commit deterministic qualified source if needed
        if: github.event_name == 'push' && github.ref_name == 'feat/operation-store-sqlite-v2'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- experimental/xenia-operation-store-sqlite-v2; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental/xenia-operation-store-sqlite-v2
          git commit -m 'fix(operation): qualify sqlite v2 store candidate'
          git push origin HEAD:feat/operation-store-sqlite-v2

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - name: Apply deterministic source hardening
        run: python3 experimental/xenia-operation-store-sqlite-v2/apply_qualification_hardening.py
      - name: Resolve dependency set under Rust 1.94
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: |
          cargo generate-lockfile
          sha256sum Cargo.lock
          grep -F 'a8f0a07bf65b28c05fa54b260d39707368ad9ed3' Cargo.lock
      - name: Rust 1.94 production check
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: cargo check --locked --all-targets
      - name: Rust 1.94 crash qualification check
        working-directory: experimental/xenia-operation-store-sqlite-v2
        run: cargo check --locked --all-targets --features crash-injection
