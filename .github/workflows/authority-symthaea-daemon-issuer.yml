name: Xenia Symthaea Daemon Authorization Issuer

on:
  pull_request:
    paths:
      - "crates/xenia-authority-symthaea-daemon-issuer/**"
      - ".github/workflows/authority-symthaea-daemon-issuer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer:
    name: Hybrid-signed daemon authorization issuer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xenia-authority-symthaea-daemon-issuer
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test exact D1 receipt issuance and signatures
        run: cargo test --all-features
