name: State Witness R2 Formatting Workbench
run-name: state-witness-r2-workbench @ ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - scratch/state-witness-r2-workbench

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy

      - name: Prove qualification base ancestry
        shell: bash
        run: |
          set -euo pipefail
          qualification_base=a5edc86c3a6dc947eb31a188fd49a416ed4ce870
          git cat-file -e "${qualification_base}^{commit}"
          git merge-base --is-ancestor "$qualification_base" HEAD
      - name: Capture repair preimage
        shell: bash
        run: |
          set -euo pipefail
          sha256sum crates/xenia-ledger/src/state_witness.rs > /tmp/state-witness-r2-preimage.sha256
          git rev-parse HEAD > /tmp/state-witness-r2-head.txt

      - name: Repair only the witness-time fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/xenia-ledger/src/state_witness.rs')
          s = p.read_text()
          old = "        let mut bundle = StateWitnessBundle::new(commitment).unwrap();\n        bundle.sign_with_ed25519(&first, 101).unwrap();\n        bundle.sign_with_ed25519(&second, 102).unwrap();"
          new = "        let witness_base = commitment.timestamp_unix_secs;\n        let mut bundle = StateWitnessBundle::new(commitment).unwrap();\n        bundle\n            .sign_with_ed25519(&first, witness_base.saturating_add(1))\n            .unwrap();\n        bundle\n            .sign_with_ed25519(&second, witness_base.saturating_add(2))\n            .unwrap();"
          if s.count(old) != 1:
              raise SystemExit('expected exactly one witness helper fixture')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply Rust 1.94 formatting
        run: cargo fmt --package xenia-ledger

      - name: Prove formatter/repair touched only the expected source surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD | LC_ALL=C sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          crates/xenia-ledger/src/lib.rs
          crates/xenia-ledger/src/state_witness.rs
          crates/xenia-ledger/src/state_witness_policy.rs
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Run xenia-ledger library tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p xenia-ledger --lib 2>&1 | tee /tmp/xenia-ledger-tests.log

      - name: Verify formatted subject
        run: cargo fmt --package xenia-ledger -- --check

      - name: Stage exact formatted artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/state-witness-r2/crates/xenia-ledger/src
          cp crates/xenia-ledger/src/lib.rs /tmp/state-witness-r2/crates/xenia-ledger/src/lib.rs
          cp crates/xenia-ledger/src/state_witness.rs /tmp/state-witness-r2/crates/xenia-ledger/src/state_witness.rs
          cp crates/xenia-ledger/src/state_witness_policy.rs /tmp/state-witness-r2/crates/xenia-ledger/src/state_witness_policy.rs
          git diff HEAD -- crates/xenia-ledger/src > /tmp/state-witness-r2/repair.patch
          cp /tmp/xenia-ledger-tests.log /tmp/state-witness-r2/xenia-ledger-tests.log
          cp /tmp/state-witness-r2-preimage.sha256 /tmp/state-witness-r2/preimage.sha256
          cp /tmp/state-witness-r2-head.txt /tmp/state-witness-r2/checkout_head.txt
          (cd /tmp/state-witness-r2 && sha256sum crates/xenia-ledger/src/*.rs repair.patch xenia-ledger-tests.log preimage.sha256 checkout_head.txt > SHA256SUMS)

      - name: Emit auditable repair handoff manifest
        shell: bash
        run: |
          set -euo pipefail
          target=crates/xenia-ledger/src/state_witness.rs
          preimage_sha256=$(cut -d' ' -f1 /tmp/state-witness-r2-preimage.sha256)
          postimage_sha256=$(sha256sum "$target" | cut -d' ' -f1)
          patch_sha256=$(sha256sum /tmp/state-witness-r2/repair.patch | cut -d' ' -f1)
          {
            printf 'manifest_version=1\n'
            printf 'qualification_base_commit=a5edc86c3a6dc947eb31a188fd49a416ed4ce870\n'
            printf 'qualification_base_is_ancestor=true\n'
            printf 'workbench_checkout_commit=%s\n' "$(cat /tmp/state-witness-r2-head.txt)"
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'github_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'github_ref=%s\n' "$GITHUB_REF"
            printf 'target_path=%s\n' "$target"
            printf 'preimage_sha256=%s\n' "$preimage_sha256"
            printf 'postimage_sha256=%s\n' "$postimage_sha256"
            printf 'repair_patch_sha256=%s\n' "$patch_sha256"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'fixture_contract=exactly_one_replacement_of_fixed_101_102_witness_helper\n'
            printf 'qualification_status=workbench_only_not_qualification_evidence\n'
          } > /tmp/state-witness-r2/REPAIR_MANIFEST
          (cd /tmp/state-witness-r2 && sha256sum REPAIR_MANIFEST >> SHA256SUMS)

      - name: Upload formatter/test workbench artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-witness-r2-formatted
          path: /tmp/state-witness-r2
          if-no-files-found: error
          retention-days: 3
