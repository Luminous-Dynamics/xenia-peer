name: Operation Authority Retention GCS Live Workflow Contract V1

on:
  pull_request:
    paths:
      - ".github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml"
      - "scripts/verify_gcs_live_workflow_contract_v1.py"
      - "docs/ADR-037-gcs-live-workflow-wif-boundary.md"
      - ".github/workflows/operation-authority-retention-gcs-live-workflow-contract-v1.yml"
  push:
    branches:
      - "feat/operation-authority-retention-gcs-live-workflow-contract-v1"
    paths:
      - ".github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml"
      - "scripts/verify_gcs_live_workflow_contract_v1.py"
      - "docs/ADR-037-gcs-live-workflow-wif-boundary.md"
      - ".github/workflows/operation-authority-retention-gcs-live-workflow-contract-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Cloud-free workflow trust contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify linter syntax
        run: python3 -m py_compile scripts/verify_gcs_live_workflow_contract_v1.py
      - name: Verify inert workflow contract
        run: python3 scripts/verify_gcs_live_workflow_contract_v1.py
      - name: Assert qualification lane cannot obtain cloud identity
        run: |
          set -euo pipefail
          WF=.github/workflows/operation-authority-retention-gcs-live-workflow-contract-v1.yml
          ! grep -F 'id-token: write' "$WF"
          ! grep -F 'google-github-actions/auth@' "$WF"
          ! grep -F 'credentials_json' "$WF"
          ! grep -F '${{ secrets.' "$WF"
          ! grep -E '^[[:space:]]*environment:' "$WF"
      - name: Capture workflow-contract evidence
        if: always()
        run: |
          E=/tmp/gcs-live-workflow-contract-evidence
          mkdir -p "$E"
          git rev-parse HEAD > "$E/HEAD.txt"
          python3 --version > "$E/PYTHON.txt"
          sha256sum \
            .github/workflow-contracts/operation-authority-retention-gcs-live-manual-v1.yml \
            scripts/verify_gcs_live_workflow_contract_v1.py \
            docs/ADR-037-gcs-live-workflow-wif-boundary.md \
            .github/workflows/operation-authority-retention-gcs-live-workflow-contract-v1.yml \
            > "$E/SHA256SUMS.txt"
          cat > "$E/FROZEN_IDENTITIES.txt" <<'EOF'
          repository=Luminous-Dynamics/xenia-peer
          repository_id=1214159052
          repository_owner_id=216969177
          active_workflow_path=.github/workflows/operation-authority-retention-gcs-live-manual-v1.yml
          checkout_sha=11d5960a326750d5838078e36cf38b85af677262
          google_auth_sha=7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
          rust_toolchain_action_sha=4360b52568e2003a75bf9bc1d59f33a8e3fc893c
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-authority-retention-gcs-live-workflow-contract-v1-evidence
          path: /tmp/gcs-live-workflow-contract-evidence
