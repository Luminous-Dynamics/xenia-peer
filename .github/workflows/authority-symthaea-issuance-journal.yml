name: Xenia Symthaea Issuance Journal

on:
  pull_request:
    paths:
      - "crates/xenia-authority-symthaea-issuance-journal/**"
      - ".github/workflows/authority-symthaea-issuance-journal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    name: Durable single-use issuance journal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/xenia-authority-symthaea-issuance-journal
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test durable replay state
        run: cargo test --all-features
