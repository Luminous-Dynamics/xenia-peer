name: Xenia Symthaea Daemon Authorization Verifier

on:
  pull_request:
    paths:
      - "crates/xenia-authority-symthaea-attestation-contract/**"
      - "crates/xenia-authority-symthaea-authorization-receipt/**"
      - "crates/xenia-authority-symthaea-daemon-certificate/**"
      - "crates/xenia-authority-symthaea-daemon-verifier/**"
      - ".github/workflows/authority-symthaea-daemon-verifier.yml"
  push:
    branches: [main]
    paths:
      - "crates/xenia-authority-symthaea-attestation-contract/**"
      - "crates/xenia-authority-symthaea-authorization-receipt/**"
      - "crates/xenia-authority-symthaea-daemon-certificate/**"
      - "crates/xenia-authority-symthaea-daemon-verifier/**"
      - ".github/workflows/authority-symthaea-daemon-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symthaea-daemon-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Trusted-host Symthaea daemon authorization verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xenia-authority-symthaea-daemon-verifier

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test delegated daemon authorization verification
        run: cargo test --all-features
