name: Content Fabric Authenticated Peer Session CI

on:
  pull_request:
    paths:
      - 'crates/xenia-peer-core/src/authenticated_peer_session.rs'
      - 'crates/xenia-peer-core/src/lib.rs'
      - 'crates/xenia-peer-core/src/handshake.rs'
      - 'crates/xenia-peer-core/Cargo.toml'
      - 'crates/xenia-handshake/**'
      - 'docs/security/AUTHENTICATED_PEER_SESSION_V1.md'
      - '.github/workflows/content-fabric-authenticated-peer-session.yml'
  push:
    branches: [main]
    paths:
      - 'crates/xenia-peer-core/src/authenticated_peer_session.rs'
      - 'crates/xenia-peer-core/src/lib.rs'
      - 'crates/xenia-peer-core/src/handshake.rs'
      - 'crates/xenia-peer-core/Cargo.toml'
      - 'crates/xenia-handshake/**'
      - 'docs/security/AUTHENTICATED_PEER_SESSION_V1.md'
      - '.github/workflows/content-fabric-authenticated-peer-session.yml'

permissions:
  contents: read

concurrency:
  group: xenia-authenticated-peer-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-196:
    name: Authenticated peer session / Rust 1.96
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check peer core
        run: cargo check --locked -p xenia-peer-core --all-targets
      - name: Clippy peer core
        run: cargo clippy --locked -p xenia-peer-core --all-targets -- -D warnings
      - name: Test peer core
        run: cargo test --locked -p xenia-peer-core
      - name: Docs peer core
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked -p xenia-peer-core --no-deps

  msrv:
    name: Authenticated peer session / Rust 1.94 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked -p xenia-peer-core --all-targets
