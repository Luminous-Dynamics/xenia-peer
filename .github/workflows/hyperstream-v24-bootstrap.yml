name: Hyperstream V24.3 Bootstrap

on:
  push:
    branches: [integration/hyperstream-v24]
    paths:
      - .github/workflows/hyperstream-v24-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: hyperstream-v24-bootstrap
  cancel-in-progress: true

jobs:
  reconstruct:
    name: Reconstruct verified V24.3 candidate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify carrier blobs and reconstruction patches
        shell: bash
        run: |
          set -euo pipefail

          carrier=.github/integration/hyperstream-v24
          expected=(
            2060bcd450e3ad0c2f8ec2b41d95aee37df8b1d7
            fdbdb567eef130622149362a8c6c5fb610e7ce87
            b4a9068a39f69583f3894acee4e3f922465ebafb
            d311a506d701a0a43aa67237c4a04e8c00a74802
            0ddc4990354316da83c1379e3bc8554ba0495ab7
            a167ff8c3bc482eee9ed4592551ff8021d275cdc
            de24ff131fe8c1d329b8cd1da5fa1fb472de5d4e
            bb2e4727eaafe9baaf6574d644d45908118d8a86
          )

          for i in $(seq -w 0 7); do
            file="$carrier/xz-$i.b64"
            actual=$(git hash-object "$file")
            expected_sha=${expected[$((10#$i))]}
            test "$actual" = "$expected_sha" || {
              echo "carrier blob mismatch: $file" >&2
              echo "expected $expected_sha" >&2
              echo "actual   $actual" >&2
              exit 1
            }
          done

          cat "$carrier"/xz-{00..07}.b64 | base64 -d | xz -dc > /tmp/hyperstream-v24.mbox
          echo '54543cfdafa06d1c6cb32239cbdf014efe757b8321d212efcb4abc7dfff1a627  /tmp/hyperstream-v24.mbox' | sha256sum -c -

          echo 'ff1503d50be30419a65ce737bbc9822f651532912f151ae0a673bc42081bd754  .github/integration/hyperstream-v24/v24.1-evidence-refresh.patch' | sha256sum -c -
          echo '829870a21e52e7e2ad61ffa26d6eebf29a9f5cfd6f411140c50cb2863aa6c432  .github/integration/hyperstream-v24/v24.2-lock-qualification.patch' | sha256sum -c -
          echo '07dfaf6561fde3f105a08cbc3b8e004ce1f5fc1ee9d47f804e2f7641bca8e758  .github/integration/hyperstream-v24/v24.3-validation-hardening.patch' | sha256sum -c -

          cp "$carrier/v24.1-evidence-refresh.patch" /tmp/v24.1-evidence-refresh.patch
          cp "$carrier/v24.2-lock-qualification.patch" /tmp/v24.2-lock-qualification.patch
          cp "$carrier/v24.3-validation-hardening.patch" /tmp/v24.3-validation-hardening.patch

      - name: Verify exact V22.1 base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "9c5a6c9303ed30985aba2e38fd09f05626482967"
          test "$(git rev-parse origin/main^{tree})" = "46464f1ad514bc55e9d1c4b7b0cdc95048f6d1a3"

      - name: Replay all 81 integration commits
        shell: bash
        run: |
          set -euo pipefail
          rebuild=/tmp/xenia-hyperstream-v24.3-rebuild
          rm -rf "$rebuild"
          git worktree add --detach "$rebuild" origin/main
          cd "$rebuild"

          git config user.name "Xenia Hyperstream Integration"
          git config user.email "hyperstream-integration@users.noreply.github.com"
          git am --3way /tmp/hyperstream-v24.mbox
          git am --3way /tmp/v24.1-evidence-refresh.patch
          git am --3way /tmp/v24.2-lock-qualification.patch
          git am --3way /tmp/v24.3-validation-hardening.patch

          test "$(git rev-list --count origin/main..HEAD)" = "81"
          test "$(git rev-parse HEAD^{tree})" = "7911f8e4dcf3c6de2a510315dc9b5f15dc226eda"
          git diff --check origin/main..HEAD
          test -z "$(git status --porcelain)"

          echo "candidate_head=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Run permanent toolchain-independent qualification gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/xenia-hyperstream-v24.3-rebuild
          python3 scripts/check_session_authorization_v23.py
          python3 scripts/check_semantic_authorization_lifecycle_v24.py
          python3 scripts/check-hyperstream-workspace-lock.py .
          for gate in 2 3 4 5 6 7 9; do
            python3 "crates/xenia-hyperstream/test-vectors/test_security_lane_gate_v${gate}.py"
          done
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/xenia-validate.sh

      - name: Publish clean candidate branch without overwrite
        shell: bash
        run: |
          set -euo pipefail
          candidate=integration/hyperstream-v24.3-qualified-candidate
          rebuild=/tmp/xenia-hyperstream-v24.3-rebuild
          cd "$rebuild"

          if git ls-remote --exit-code --heads origin "refs/heads/$candidate" >/dev/null 2>&1; then
            echo "refusing to overwrite existing candidate branch: $candidate" >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/$candidate"
          echo "Published $candidate"
          echo "HEAD=$candidate_head"
          echo "TREE=$candidate_tree"
