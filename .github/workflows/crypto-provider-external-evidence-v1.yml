name: Crypto Provider External Evidence V1

on:
  pull_request:
    paths:
      - "docs/crypto/provider_assurance_v1.json"
      - "docs/crypto/PROVIDER_ASSURANCE_V1.md"
      - "docs/crypto/provider_external_evidence_v1.json"
      - "docs/crypto/PROVIDER_EXTERNAL_EVIDENCE_V1.md"
      - "scripts/validate_crypto_provider_assurance_v1.py"
      - "scripts/validate_crypto_provider_external_evidence_v1.py"
      - ".github/workflows/crypto-provider-assurance-v1.yml"
      - ".github/workflows/crypto-provider-external-evidence-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/crypto/provider_assurance_v1.json"
      - "docs/crypto/PROVIDER_ASSURANCE_V1.md"
      - "docs/crypto/provider_external_evidence_v1.json"
      - "docs/crypto/PROVIDER_EXTERNAL_EVIDENCE_V1.md"
      - "scripts/validate_crypto_provider_assurance_v1.py"
      - "scripts/validate_crypto_provider_external_evidence_v1.py"
      - ".github/workflows/crypto-provider-assurance-v1.yml"
      - ".github/workflows/crypto-provider-external-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-evidence-snapshot:
    name: Validate dated provider evidence snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          git status --short

      - name: Revalidate immutable provider identity root
        run: python3 scripts/validate_crypto_provider_assurance_v1.py .

      - name: Validate offline external-evidence snapshot and negative controls
        run: python3 scripts/validate_crypto_provider_external_evidence_v1.py .

      - name: Retain deterministic evidence digests in log
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            docs/crypto/provider_assurance_v1.json \
            docs/crypto/PROVIDER_ASSURANCE_V1.md \
            docs/crypto/provider_external_evidence_v1.json \
            docs/crypto/PROVIDER_EXTERNAL_EVIDENCE_V1.md \
            scripts/validate_crypto_provider_assurance_v1.py \
            scripts/validate_crypto_provider_external_evidence_v1.py

      - name: Postflight checkout immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
