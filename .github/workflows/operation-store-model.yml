name: Operation Store Reference Model

on:
  pull_request:
    paths:
      - "contracts/xenia-operation-store-model/**"
      - "contracts/xenia-operation-receipt-finalization/**"
      - "contracts/xenia-operation-store-frontier/**"
      - ".github/workflows/operation-store-model.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy
      - name: Resolve standalone model lock
        working-directory: contracts/xenia-operation-store-model
        run: |
          cargo generate-lockfile
          sha256sum Cargo.lock
      - name: Format
        working-directory: contracts/xenia-operation-store-model
        run: cargo fmt --check
      - name: Test
        working-directory: contracts/xenia-operation-store-model
        run: cargo test --locked
      - name: Clippy
        working-directory: contracts/xenia-operation-store-model
        run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - name: Resolve standalone model lock
        working-directory: contracts/xenia-operation-store-model
        run: cargo generate-lockfile
      - name: MSRV check
        working-directory: contracts/xenia-operation-store-model
        run: cargo check --locked
