name: Xenia Evidence Auth Verifier

on:
  pull_request:
    paths:
      - "crates/xenia-authority-evidence-auth-verifier/**"
      - ".github/workflows/authority-evidence-auth-verifier.yml"
permissions:
  contents: read

concurrency:
  group: evidence-auth-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Context-bound hybrid evidence auth verifier
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/xenia-authority-evidence-auth-verifier

    steps:
      - name: Checkout exact subject head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind frozen qualification subject
        shell: bash
        run: |
          set -euo pipefail
          qualification_base=e9c4456d957574163a9ea571523bcc13bc4ad10a
          qualification_subject=66566021c0a45b49f1aeacc7d2c2a6a3177114d8
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"

          # The workflow itself may advance after a qualification subject is frozen.
          # First prove that this run is executing the workflow at the exact PR head.
          test "$(git rev-parse HEAD)" = "$expected_head"

          # Then freeze the actual qualification target independently of the workflow-only
          # control-plane commit that triggered this run.
          git cat-file -e "$qualification_subject^{commit}"
          test "$(git merge-base "$qualification_base" "$qualification_subject")" = "$qualification_base"
          test "$(git rev-parse "$qualification_subject^")" = "ec84129a9ffb329f2e295ec0021311ace16f7396"

          expected_commits=(
            '73231705a66c58064bfb40e5ee074267823ff593'
            'ec84129a9ffb329f2e295ec0021311ace16f7396'
            '66566021c0a45b49f1aeacc7d2c2a6a3177114d8'
          )
          mapfile -t qualified_commits < <(git rev-list --reverse "$qualification_base..$qualification_subject")
          diff -u <(printf '%s\n' "${expected_commits[@]}") <(printf '%s\n' "${qualified_commits[@]}")

          mapfile -t changed < <(git diff --name-only "$qualification_base" "$qualification_subject" | sort)
          expected=(
            '.github/workflows/authority-evidence-auth-verifier.yml'
            'crates/xenia-authority-evidence-auth-verifier/Cargo.toml'
            'crates/xenia-authority-evidence-auth-verifier/src/lib.rs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

          # All qualification gates below must execute against the frozen subject, not
          # against a later workflow-only control-plane commit.
          git checkout --detach "$qualification_subject"
          test "$(git rev-parse HEAD)" = "$qualification_subject"

      - name: Install pinned Rust 1.94
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test real crypto
        run: cargo test --all-features
