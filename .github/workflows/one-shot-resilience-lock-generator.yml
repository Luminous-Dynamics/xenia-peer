name: One-shot resilience lock generator

on:
  push:
    branches:
      - feat/ransomware-operator-compromise-evidence-v1
    paths:
      - ".github/workflows/one-shot-resilience-lock-generator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-verify-commit:
    name: Generate, verify, and commit standalone lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert self-pinned clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e crates/xenia-resilience-evidence/Cargo.lock

      - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9
        with:
          toolchain: 1.94.1

      - name: Toolchain provenance
        run: |
          rustc -vV
          cargo -Vv

      - name: Generate standalone lock with MSRV Cargo
        run: cargo generate-lockfile --manifest-path crates/xenia-resilience-evidence/Cargo.toml

      - name: Verify generator scope and lock provenance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed 's/^?? //; s/^...//')
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "crates/xenia-resilience-evidence/Cargo.lock" ]]; then
            printf 'Unexpected generated scope:\n' >&2
            git status --short >&2
            exit 1
          fi
          sha256sum crates/xenia-resilience-evidence/Cargo.lock

      - name: Verify MSRV uses generated resolution unchanged
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum crates/xenia-resilience-evidence/Cargo.lock | awk '{print $1}')"
          cargo test --locked --manifest-path crates/xenia-resilience-evidence/Cargo.toml
          after="$(sha256sum crates/xenia-resilience-evidence/Cargo.lock | awk '{print $1}')"
          test "$before" = "$after"

      - name: Commit generated lock and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-resilience-lock-generator.yml
          git add crates/xenia-resilience-evidence/Cargo.lock
          git diff --cached --name-only
          git commit -m "chore(resilience): commit standalone evidence lockfile"
          git push origin HEAD:feat/ransomware-operator-compromise-evidence-v1
