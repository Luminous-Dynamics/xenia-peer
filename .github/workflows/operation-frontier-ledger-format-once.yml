name: One-shot Operation Frontier Ledger Formatter

on:
  push:
    branches:
      - "feat/operation-frontier-ledger-witness-v1"
    paths:
      - "contracts/xenia-operation-frontier-ledger-witness/src/lib.rs"
      - "experimental/xenia-operation-frontier-ledger-adapter/src/lib.rs"
      - "experimental/xenia-operation-frontier-ledger-adapter/tests/successor.rs"
      - ".github/workflows/operation-frontier-ledger-format-once.yml"

permissions:
  contents: write

concurrency:
  group: operation-frontier-ledger-format-once
  cancel-in-progress: false

jobs:
  rustfmt-and-remove-self:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Apply exact rustfmt repair
        shell: bash
        run: |
          set -euo pipefail

          cargo fmt --manifest-path contracts/xenia-operation-frontier-ledger-witness/Cargo.toml
          cargo fmt --manifest-path experimental/xenia-operation-frontier-ledger-adapter/Cargo.toml

          mapfile -t changed < <(git diff --name-only)
          printf 'rustfmt changed:\n'
          printf '  %s\n' "${changed[@]}"

          allowed() {
            case "$1" in
              contracts/xenia-operation-frontier-ledger-witness/src/lib.rs|\
              experimental/xenia-operation-frontier-ledger-adapter/src/lib.rs|\
              experimental/xenia-operation-frontier-ledger-adapter/tests/successor.rs)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }

          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            allowed "$path" || {
              echo "unexpected rustfmt mutation: $path" >&2
              exit 1
            }
          done

          git diff --check
          git rm .github/workflows/operation-frontier-ledger-format-once.yml

          git config user.name "xenia-qualification-bot"
          git config user.email "xenia-qualification-bot@users.noreply.github.com"
          git add \
            contracts/xenia-operation-frontier-ledger-witness/src/lib.rs \
            experimental/xenia-operation-frontier-ledger-adapter/src/lib.rs \
            experimental/xenia-operation-frontier-ledger-adapter/tests/successor.rs

          git diff --cached --check
          git status --short
          git commit -m "style(operation): rustfmt frontier witness and adapter"
          git push origin "HEAD:${{ github.ref_name }}"
