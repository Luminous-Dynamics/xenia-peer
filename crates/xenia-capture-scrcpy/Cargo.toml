[package]
name = "xenia-capture-scrcpy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Phone-as-source screen capture for the Xenia remote-session stack: drives a real Android device's scrcpy-server over ADB and decodes its HEVC/H.264 stream into xenia_capture::ScreenCapture frames. Ported from symthaea-phone-embodiment's hardware-verified scrcpy client (same license)."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
xenia-capture = { path = "../xenia-capture" }
# Optional, unlike xenia-video's own `ffmpeg-next` dep this mirrors: this
# crate is a workspace member, so `cargo check --workspace` builds it
# directly regardless of which downstream feature (if any) pulls it in --
# a plain (non-optional) ffmpeg-next here means every `cargo check
# --workspace` on any machine, CI or not, requires system libavutil dev
# headers just to typecheck this one crate. Gated behind `hevc` instead,
# default = [], matching xenia-video's existing convention.
ffmpeg-next = { version = "7", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
# The actual scrcpy decode pipeline (HEVC via ffmpeg-next). Without it,
# only the ADB/process-lifecycle helpers and the pure wire-protocol parser
# in `scrcpy::wire` (no I/O, no ffmpeg) are compiled.
hevc = ["dep:ffmpeg-next"]
