[package]
name = "xenia-handshake-v2-contract"
version = "0.0.0-m0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz <<maintainer-email>>"]
license = "Apache-2.0 OR MIT"
description = "Non-production V2 negotiated-handshake wire and transcript contract for Xenia"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
publish = false

[dependencies]
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
sha2 = "0.10"
thiserror = "1"
xenia-negotiation = { path = "../xenia-negotiation" }
xenia-negotiation-codec = { path = "../xenia-negotiation-codec" }

# Staged outside the production root workspace until the parent negotiation/
# codec exact-head gates are green and xenia-peer-core deliberately consumes it.
[workspace]
