[package]
name = "xenia-peer-core"
description = "Core session + transport primitives for xenia-peer. M0 — pre-alpha, no real capture/encode yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # unpublished until M1 makes it useful

[dependencies]
xenia-wire = { workspace = true, features = ["consent"] }
xenia-handshake = { path = "../xenia-handshake" }
xenia-exec-proto = { path = "../xenia-exec-proto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
ed25519-dalek = "2"
bincode = { workspace = true }
blake3 = "1"
thiserror = "2.0"
tracing = "0.1"
rand = "0.8"
opus = { version = "0.3.1", optional = true }

[features]
opus = ["dep:opus"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
