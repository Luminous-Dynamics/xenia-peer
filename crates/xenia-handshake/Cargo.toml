[package]
name = "xenia-handshake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0 OR MIT"
description = "ML-KEM-768 session key establishment with mandatory Ed25519 + ML-DSA-65 transcript authentication for Xenia's hybrid-pq-transcript-v1 handshake. Full-PQC remains a separately gated future profile."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
bincode = { workspace = true }
blake3 = "1.5"

ml-kem = { version = "0.3.0-rc.2", default-features = false, features = ["zeroize", "getrandom"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
# Same version xenia-ledger pins for its ML-DSA evidence-signature
# backends -- kept in lockstep so both crates resolve one ml-dsa tree.
ml-dsa = { version = "0.1.1", default-features = true }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
