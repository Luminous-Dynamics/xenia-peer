[package]
name = "xenia-symthaea-daemon-authority-producer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz / Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Producer-gated daemon signing for portable Symthaea authority receipts"
publish = false

[dependencies]
ed25519-dalek = "2"
thiserror = "1"
xenia-handshake = { path = "../xenia-handshake" }
xenia-symthaea-attestation-authority = { path = "../xenia-authority-symthaea-attestation-authority" }
xenia-symthaea-attestation-contract = { path = "../xenia-authority-symthaea-attestation-contract" }
xenia-symthaea-daemon-authority-receipt = { path = "../xenia-authority-symthaea-daemon-receipt" }

[dev-dependencies]
xenia-symthaea-attestation-verifier = { path = "../xenia-authority-symthaea-attestation-verifier" }
xenia-symthaea-daemon-authority-crypto = { path = "../xenia-authority-symthaea-daemon-crypto" }

# Standalone producer theorem. Live daemon policy sourcing and durable replay admission are later tranches.
[workspace]
