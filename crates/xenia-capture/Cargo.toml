[package]
name = "xenia-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0 OR MIT"
description = "Screen-capture abstraction for the Xenia remote-session stack. Cross-platform via scap (Windows WGC, macOS ScreenCaptureKit, Linux PipeWire/xdg-desktop-portal). Wayland-only on Linux by design (see xenia-peer ADR-001)."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
thiserror.workspace = true
tracing.workspace = true

# scap backend — cross-platform (Windows + macOS + Linux Wayland via PipeWire).
# Gated off by default because scap pulls heavy system deps (libpipewire-0.3,
# libspa on Linux) that only the nix-develop environment provides. See
# mycelix-sovereign/docs/adr/0001-screen-capture-backend.md for the decision.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# Points at Luminous-Dynamics/scap, a *deliberately maintained* downstream of
# CapSoftware/scap -- not a temporary fork waiting on upstream.
#
# It carries three Linux-engine fixes, all offered upstream as
# https://github.com/CapSoftware/scap/pull/183:
#   1. two-level Frame::Video(VideoFrame::*) enum + SystemTime display_time
#      (upstream's Linux engine does not compile against the current enum);
#   2. a bounded internal frame channel (the unbounded one leaked ~1.44 GB of
#      1.47 GB in a 25.76 s heaptrack repro -- see ROADMAP.md's B2 follow-up);
#   3. PipeWire format advertisement matching what the engine can decode
#      (RGBA was advertised with no decode arm; xBGR was decodable but never
#      advertised -- a pre-existing upstream bug, not one PR #183 introduced).
#
# Maintenance policy (see that repo's README):
#   * pin an EXACT rev, never a branch -- a mutable pin is not a pin, and a
#     branch pin silently re-resolves on `cargo update`;
#   * keep divergence minimal and upstream-first;
#   * re-sync when upstream moves. It last moved 2025-08-05, which is why this
#     downstream exists rather than us waiting for a release. Do not make
#     Xenia's buildability depend on that repo's pace.
#
# The repo is public. It was briefly private, which made this public repo
# anonymously unbuildable and made CI green only via warm caches -- see
# docs/roadmap/XENIA_COMPREHENSIVE_REVIEW_2026-07-28.md finding F5.
#
# The `scap-backend` feature enables Linux PipeWire capture (xdg-desktop-
# portal on GNOME/KDE, xdg-desktop-portal-wlr on wlroots), macOS
# ScreenCaptureKit, Windows Graphics Capture.  Linux builds require
# libpipewire-0.3 + libspa-0.2 + libdbus-1 dev headers, provided by
# `nix develop` inside the xenia-peer workspace.
scap = { git = "https://github.com/Luminous-Dynamics/scap", rev = "0ff8e89cffb9dd41f5a2cbaa3d6c2c84f2a6ff38", optional = true }
cpal = { version = "0.15.3", optional = true }

[features]
default = []
# Cross-platform scap backend. Primary backend per ADR 0001.
# Enables ScapCapture on Linux (PipeWire portal), macOS (ScreenCaptureKit),
# Windows (Windows Graphics Capture). Linux builds require
# libpipewire-0.3 + libspa-0.2 dev headers (provided by `nix develop`).
scap-backend = ["dep:scap"]
# Cross-platform host audio capture via CPAL. Linux builds require
# ALSA development headers (`libasound2-dev` on Ubuntu).
audio-cpal = ["dep:cpal"]
# wlr-screencopy capture on wlroots-based compositors (Sway, Hyprland,
# labwc). Pre-existing scaffold; superseded for most deployments by
# `scap-backend` via the xdg-desktop-portal-wlr bridge. Retained for
# potential direct-wlr-screencopy path if portal performance is inadequate.
# Requires wayland-client + wayland-protocols dev headers.
wayland-wlroots = []
# xdg-desktop-portal ScreenCast capture on GNOME/KDE. Pre-existing scaffold;
# superseded by `scap-backend`. Retained for potential hand-rolled path if
# scap proves unstable. Requires zbus + ashpd.
wayland-portal = []

[dev-dependencies]
# capture_bench's synthetic on-screen activity generator (XWayland window
# repaint) — PipeWire's damage-driven ScreenCast under-reports fps against
# a static desktop, so the harness needs to generate real screen changes
# itself rather than depend on a human moving the mouse during the run.
x11rb = "0.13"

# W0 scap validation harness (docs/capture-validation-runbook.md).
# Only builds when scap-backend feature is enabled — no-op in default
# `cargo build` / `cargo test` runs.
[[example]]
name = "capture_bench"
path = "examples/capture_bench.rs"
required-features = ["scap-backend"]
