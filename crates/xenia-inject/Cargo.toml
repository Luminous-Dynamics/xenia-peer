[package]
name = "xenia-inject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0 OR MIT"
description = "Input-injection abstraction for the Xenia remote-session stack. Pointer / keyboard / touch events via platform backends. Ported from Symthaea's rdp_input.rs."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde = { version = "1", features = ["derive"] }

# xdg-desktop-portal RemoteDesktop backend (see src/xdg_portal.rs).
# High-level async bindings -- deliberately not the low-level `dbus`
# crate xenia-capture's scap dependency uses, whose hand-rolled
# request/response signal matching has a real, confirmed race (see
# xenia-capture's MAX_BUILD_ATTEMPTS retry and mycelix-sovereign's
# capture-validation-runbook.md).
ashpd = { version = "0.9", optional = true, default-features = false, features = ["tokio"] }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time"] }

# uinput backend (see the "uinput" feature below). Actively maintained,
# clean dependency tree -- deliberately not the older `uinput` crate
# (0.1.3), which pulls in a ~2018-era `nix 0.10`/`gcc` chain.
input-linux = { version = "0.7.1", optional = true }
nix = { version = "0.29", optional = true }

# SendInput backend for Windows (see src/windows.rs). Talks to user32
# directly -- Windows has no portal/consent-dialog layer analogous to
# xdg-desktop-portal, so this is the same trust model as `uinput`
# (host-level access is the only gate). Microsoft's official binding,
# feature-gated to just the two Win32 modules this backend needs.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# CGEvent backend for macOS (see src/macos.rs). Same direct-to-OS trust
# model as `uinput`/`windows-sendinput` -- macOS's own gate is the
# Accessibility permission the OS prompts for on first real use, not
# anything this crate mediates.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", optional = true }

[features]
default = []
# wlr-virtual-pointer-v1 + zwp-virtual-keyboard-v1 backend for
# wlroots compositors (Sway, Hyprland, labwc). Scaffold today;
# real wayland-client plumbing lands with the matching
# xenia-capture backend.
wayland-virtual = []
# uinput kernel-level backend. Works on any Linux with
# /dev/uinput accessible (root, `input` group, or udev rule).
uinput = ["dep:input-linux", "dep:nix"]
# xdg-desktop-portal RemoteDesktop backend for GNOME/KDE (portal-based,
# no host permissions beyond the interactive consent dialog). Primary
# backend per the xenia-capture precedent for portal-based Linux paths.
xdg-portal = ["dep:ashpd", "dep:tokio"]
# Win32 SendInput backend. Real mouse/keyboard injection on Windows;
# no-op to enable on any other target (the `windows` dependency only
# exists in the windows-target table above, and src/windows.rs is
# additionally target_os-gated).
windows-sendinput = ["dep:windows"]
# CoreGraphics CGEvent backend. Real mouse/keyboard injection on macOS;
# no-op to enable on any other target, same shape as windows-sendinput.
macos-cgevent = ["dep:core-graphics"]

[dev-dependencies]
bincode = "1.3"

# RemoteDesktop portal real-hardware validation harness. Only builds
# when xdg-portal is enabled -- no-op in default `cargo build`/`cargo
# test` runs, matching xenia-capture's capture_bench pattern.
[[example]]
name = "inject_bench"
path = "examples/inject_bench.rs"
required-features = ["xdg-portal"]

# uinput real-hardware validation harness. Only builds when uinput is
# enabled.
[[example]]
name = "uinput_smoke"
path = "examples/uinput_smoke.rs"
required-features = ["uinput"]
