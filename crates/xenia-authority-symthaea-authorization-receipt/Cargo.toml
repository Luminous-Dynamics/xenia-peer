[package]
name = "xenia-symthaea-authorization-receipt"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz / Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Portable daemon authorization receipt contract for Symthaea verification attestations"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
xenia-operator-proto = { path = "../xenia-operator-proto" }
xenia-symthaea-attestation-contract = { path = "../xenia-authority-symthaea-attestation-contract" }
xenia-symthaea-attestation-authority = { path = "../xenia-authority-symthaea-attestation-authority" }
xenia-symthaea-rbac = { package = "xenia-symthaea-attestation-rbac", path = "../xenia-authority-symthaea-rbac" }

[dev-dependencies]
serde_json = "1"

# Standalone portable contract. Live daemon signing/verification is a later tranche.
[workspace]
