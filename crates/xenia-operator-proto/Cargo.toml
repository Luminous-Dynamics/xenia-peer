[package]
name = "xenia-operator-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true
description = "Shared operator-RBAC protocol: roles, actions, and the exact signed transcripts, used by both the xenia-peer daemon and the sovereign-admin console so a signature the console produces is byte-identical to what the daemon verifies."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For scope_digest() only -- consent_action_transcript_v2 needs a
# domain-separated commitment to the scope string, and blake3 is already
# proven wasm32-unknown-unknown-compatible elsewhere in this workspace
# (xenia-ledger), so it doesn't compromise this crate's "compiles for wasm32"
# constraint (see module doc comment).
blake3 = "1.5"
