[package]
name = "xenia-symthaea-daemon-authorization-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz / Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Real-crypto verifier for Xenia daemon authorization receipts consumed by Symthaea"
publish = false

[dependencies]
ed25519-dalek = "2"
thiserror = "1"
xenia-handshake = { path = "../xenia-handshake" }
xenia-operator-proto = { path = "../xenia-operator-proto" }
xenia-symthaea-attestation-contract = { path = "../xenia-authority-symthaea-attestation-contract" }
xenia-symthaea-authorization-receipt = { path = "../xenia-authority-symthaea-authorization-receipt" }
xenia-symthaea-daemon-certificate-commitment = { path = "../xenia-authority-symthaea-daemon-certificate" }

[dev-dependencies]

# Standalone verifier boundary. Live daemon issuance/state integration is later.
