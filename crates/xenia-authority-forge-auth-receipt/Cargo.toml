[package]
name = "xenia-forge-auth-receipt"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz / Luminous Dynamics"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Portable Forge-bound Xenia hybrid-authentication transcript and receipt contract"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
serde_json = "1"

# Deliberately standalone until the daemon integration tranche. This matches
# Xenia's contract-first qualification boundary: production workspace/runtime
# integration removes this isolation and pays the full workspace CI cost.
[workspace]
