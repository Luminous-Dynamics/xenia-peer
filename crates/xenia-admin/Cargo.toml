[package]
name = "xenia-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Leptos CSR admin console for the Xenia remote-session stack — the operator surface of the Mycelix Sovereign suite."
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "xenia-admin"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_meta = "0.8"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Storage", "Window", "Location"] }
serde = { workspace = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
