[package]
name = "xenia-authority-rekey-profile-binding"
version = "0.0.0-m0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz <<maintainer-email>>"]
license = "Apache-2.0 OR MIT"
description = "Immutable rekey-domain binding for Xenia authority lineages"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
xenia-negotiation = { path = "../xenia-negotiation" }
xenia-authority-activation-evidence = { path = "../xenia-authority-activation-evidence" }
xenia-authority-lineage-epoch-evidence = { path = "../xenia-authority-lineage-epoch-evidence" }
xenia-authority-rekey-transition-evidence = { path = "../xenia-authority-rekey-transition-evidence" }

[dev-dependencies]
bincode = "1.3"

# Staged outside the root production workspace until the V2/authenticated
# authority stack is validated and deliberately integrated.
[workspace]
