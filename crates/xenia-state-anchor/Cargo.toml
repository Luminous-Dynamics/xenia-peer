[package]
name = "xenia-state-anchor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Generic domain-separated signed monotonic state anchors for Xenia and Luminous cross-system continuity"
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
xenia-ledger = { path = "../xenia-ledger" }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
