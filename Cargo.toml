[workspace]
members = [
    "crates/xenia-peer-core",
    "apps/xenia-peer",
    "apps/xenia-viewer",
    "crates/xenia-capture",
    "crates/xenia-video",
    "crates/xenia-transport-ws",
    "crates/xenia-transport-quic",
    "crates/xenia-inject",
    "crates/xenia-handshake",
    "crates/xenia-ledger",
    "apps/sovereign-admin",
]
# sovereign-admin is a wasm32-unknown-unknown CSR bin; keep it out of
# host-only cargo check/build invocations.
default-members = [
    "crates/xenia-peer-core",
    "apps/xenia-peer",
    "apps/xenia-viewer",
    "crates/xenia-capture",
    "crates/xenia-video",
    "crates/xenia-transport-ws",
    "crates/xenia-transport-quic",
    "crates/xenia-inject",
    "crates/xenia-handshake",
    "crates/xenia-ledger",
]
resolver = "2"

[workspace.package]
version = "0.0.0-m0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz <<maintainer-email>>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
homepage = "https://github.com/Luminous-Dynamics/xenia-peer"

[workspace.dependencies]
xenia-wire = "0.2.0-alpha.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"
tracing = "0.1"
bs58 = "0.5"
anyhow = "1.0"
serde_json = "1.0"
tracing-subscriber = "0.3"
uuid = "1.0"
regex = "1.11"
rmp-serde = "1.3"
ndarray = "0.16"
nalgebra = "0.33"
petgraph = "0.6"
rustfft = "6.2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
dashmap = "6.1"
lru = "0.12"
strsim = "0.11"
tree-sitter = "0.24"
rubato = "0.16"
tree-sitter-nix = "0.0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-chrome = "0.7"
rayon = "1.10"
blake3 = "1.6"

[workspace.lints.rust]
unsafe_code = "deny"

# Workspace profiles moved from apps/sovereign-admin.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
