[workspace]
members = [
    "crates/xenia-peer-core",
    "crates/xenia-operator-proto",
    "apps/xenia-peer",
    "apps/xenia-viewer",
    "crates/xenia-capture",
    "crates/xenia-capture-scrcpy",
    "crates/xenia-video",
    "crates/xenia-transport-ws",
    "crates/xenia-transport-quic",
    "crates/xenia-inject",
    "crates/xenia-handshake",
    "crates/xenia-ledger",
    "crates/xenia-mobile-ffi",
    "apps/sovereign-admin",
]
# sovereign-admin is a wasm32-unknown-unknown CSR bin; keep it out of
# host-only cargo check/build invocations.
default-members = [
    "crates/xenia-peer-core",
    "crates/xenia-operator-proto",
    "apps/xenia-peer",
    "apps/xenia-viewer",
    "crates/xenia-capture",
    "crates/xenia-capture-scrcpy",
    "crates/xenia-video",
    "crates/xenia-transport-ws",
    "crates/xenia-transport-quic",
    "crates/xenia-inject",
    "crates/xenia-handshake",
    "crates/xenia-ledger",
    "crates/xenia-mobile-ffi",
]
resolver = "2"

[workspace.package]
version = "0.0.0-m0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz <<maintainer-email>>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
homepage = "https://github.com/Luminous-Dynamics/xenia-peer"

[workspace.dependencies]
xenia-wire = "0.2.0-alpha.4"
xenia-operator-proto = { path = "crates/xenia-operator-proto" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
bincode = "1.3"
thiserror = "1"
tracing = "0.1"
bs58 = "0.5"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

# TEMPORARY dev-time override: xenia-wire's operator_rekey + handshake_highsec
# modules (forward secrecy + high-security suite for the operator sealed
# channel) are unreleased -- see xenia-wire PR #10
# (https://github.com/Luminous-Dynamics/xenia-wire/pull/10). Remove this patch
# and bump the pinned version above once that PR merges and a release
# containing it is published (mirrors the workflow PR #47 established:
# develop against a git xenia-wire, then publish + pin + drop the patch).
[patch.crates-io]
xenia-wire = { git = "https://github.com/Luminous-Dynamics/xenia-wire", branch = "xenia/operator-forward-secrecy-and-highsec" }

# Workspace profiles moved from apps/sovereign-admin.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
