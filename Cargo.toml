[workspace]
members = [
    "crates/xenia-peer-core",
    "crates/xenia-operator-proto",
    "crates/xenia-operator-agent-proto",
    "apps/xenia-peer",
    "apps/xenia-viewer",
    "crates/xenia-capture",
    "crates/xenia-capture-scrcpy",
    "crates/xenia-video",
    "crates/xenia-transport-ws",
    "crates/xenia-transport-quic",
    "crates/xenia-inject",
    "crates/xenia-handshake",
    "crates/xenia-ledger",
    "crates/xenia-mobile-ffi",
    "crates/xenia-secure-file",
    "crates/xenia-zk-protocol",
    "crates/xenia-launcher-core",
    "crates/xenia-launcher-shell",
    "apps/xenia-launcher-windows",
    "apps/xenia-launcher-linux",
    "apps/xenia-launcher-macos",
    "apps/sovereign-admin",
    "apps/xenia-operator-agent",
]
# sovereign-admin is a wasm32-unknown-unknown CSR bin; xenia-launcher-windows
# is Windows-only (target-gated `windows` crate dependency, unconditional
# Win32 API usage in its own source); xenia-launcher-shell and
# xenia-launcher-linux both depend on tray-icon's Linux backend, which needs
# GTK3/libappindicator system dev headers a bare host doesn't have;
# xenia-launcher-macos is macOS-only (target-gated `objc2`/AppKit
# dependencies, unconditional Objective-C message-send usage in its own
# source) -- keep all five out of host-only cargo check/build invocations
# on other platforms/without those system libs. Each has its own dedicated
# CI job that provides what it needs (windows-latest runner, apt-get'd GTK3
# on ubuntu-latest, or a real macos-latest runner).
default-members = [
    "crates/xenia-peer-core",
    "crates/xenia-operator-proto",
    "crates/xenia-operator-agent-proto",
    "apps/xenia-peer",
    "apps/xenia-viewer",
    "crates/xenia-capture",
    "crates/xenia-capture-scrcpy",
    "crates/xenia-video",
    "crates/xenia-transport-ws",
    "crates/xenia-transport-quic",
    "crates/xenia-inject",
    "crates/xenia-handshake",
    "crates/xenia-ledger",
    "crates/xenia-mobile-ffi",
    "crates/xenia-secure-file",
    "crates/xenia-zk-protocol",
    "crates/xenia-launcher-core",
    "apps/xenia-operator-agent",
]
resolver = "2"

[workspace.package]
version = "0.0.0-m0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz <<maintainer-email>>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
homepage = "https://github.com/Luminous-Dynamics/xenia-peer"

[workspace.dependencies]
xenia-wire = "0.2.0-alpha.9"
xenia-operator-proto = { path = "crates/xenia-operator-proto" }
xenia-operator-agent-proto = { path = "crates/xenia-operator-agent-proto" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
bincode = "1.3"
thiserror = "1"
tracing = "0.1"
bs58 = "0.5"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

# Workspace profiles moved from apps/sovereign-admin.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
