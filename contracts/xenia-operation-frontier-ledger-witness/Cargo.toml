[package]
name = "xenia-operation-frontier-ledger-witness"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Signed external witness contracts binding Xenia operation-store frontiers to ledger checkpoints"

[workspace]

[dependencies]
bincode = "1.3"
blake3 = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
thiserror = "1"
xenia-operation-store-frontier = { path = "../xenia-operation-store-frontier" }
