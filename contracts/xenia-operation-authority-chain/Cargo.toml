[package]
name = "xenia-operation-authority-chain"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Epoch-bound admission, arm, and store authority chain for Xenia privileged operations"

[workspace]

[dependencies]
bincode = "1.3"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
xenia-operation-authority-epoch = { path = "../xenia-operation-authority-epoch" }
xenia-operation-authority-envelope = { path = "../xenia-operation-authority-envelope" }
