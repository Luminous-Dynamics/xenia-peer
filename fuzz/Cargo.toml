[package]
name = "xenia-peer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Root's Cargo.toml is a workspace with an explicit `members` list (not a
# glob) that doesn't name this directory -- declaring this crate as its own
# (empty) workspace root stops cargo from trying to auto-join the parent
# workspace when building here directly, mirroring xenia-wire's own
# `fuzz/` (which achieves the same thing via the parent's `exclude` list
# instead, since that repo's workspace uses a glob).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
xenia-operator-agent-proto = { path = "../crates/xenia-operator-agent-proto" }
xenia-operator-proto = { path = "../crates/xenia-operator-proto" }
xenia-handshake = { path = "../crates/xenia-handshake" }

[[bin]]
name = "fuzz_agent_request"
path = "fuzz_targets/fuzz_agent_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_evidence_verify"
path = "fuzz_targets/fuzz_evidence_verify.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
