[package]
name = "xenia-operator-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Local signing agent for the Xenia operator identity: holds the operator's Ed25519 + ML-DSA seeds in a permission-restricted file instead of browser localStorage, and serves them to the sovereign-admin console over a token-authenticated, origin-restricted localhost API."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
xenia-handshake = { path = "../../crates/xenia-handshake" }
xenia-wire = { workspace = true, features = ["handshake"] }
xenia-operator-proto = { workspace = true }
xenia-operator-agent-proto = { workspace = true }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `daemon_evidence` verifies daemon-signed Ed25519 signatures directly
# (`xenia-handshake` doesn't re-export the `Signature` type). Matches the
# version pinned by `xenia-handshake`/`xenia-peer`.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
# `agent_session`: derives the session-MAC key from the pairing token
# (`derive_key`) and MACs each session token (`keyed_hash`). Same version
# already used by `xenia-ledger`/`xenia-peer` for their hash chain.
blake3 = "1.5"
# `audit_log`: canonical entry-hash preimage encoding, mirroring
# `xenia_ledger::Chain`'s own bincode-v1-then-blake3 pattern (same
# reasoning: deterministic, length-prefixed encoding).
bincode = "1"
# `audit_log`: `AgentAuditEntry::signature` is a 64-byte Ed25519 signature;
# serde's built-in array support doesn't cover that length. Same crate
# `xenia-ledger` already uses for its own 64-byte `LedgerEntry::signature`.
serde-big-array = "0.5"

[target.'cfg(unix)'.dependencies]
# `process`: safe getuid() (no unsafe code, per workspace lints) --
# verifying an existing identity/token file is owned by this process's
# user before trusting it. `fs`: safe openat/fstat/mkdirat/renameat --
# descriptor-relative, O_NOFOLLOW file access in `secure_file.rs`, closing
# the TOCTOU window a metadata-check-then-separate-open pattern leaves
# open, without any unsafe code.
rustix = { version = "0.38", default-features = false, features = ["process", "std", "fs"] }

[dev-dependencies]
# `ServiceExt::oneshot` for driving the axum routes in tests without
# binding a real socket.
tower = { version = "0.5", features = ["util"] }
# Real host-side handshake round-trip tests for `/v1/handshake/*` (Track
# B): `perform_host_handshake_authenticating_peer` + `TcpTransport` drive
# the exact host role a real daemon plays over a real loopback socket, so
# the standard-suite test proves this agent's viewer handling is genuinely
# wire-compatible rather than just internally self-consistent -- the same
# reasoning `sovereign-admin`'s `sealed_consent.rs` doc comment gives for
# why this crate's own `handshake_cross_compat` test exists.
xenia-peer-core = { path = "../../crates/xenia-peer-core" }

[lints]
workspace = true
