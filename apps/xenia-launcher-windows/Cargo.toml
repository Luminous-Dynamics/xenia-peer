[package]
name = "xenia-launcher-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Minimal native Windows tray shell for xenia-launcher-core: system tray icon + menu, a small settings window, balloon notifications, and start-at-login integration. Windows-only -- see docs/roadmap for why this isn't Tauri yet."
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "xenia-launcher"
path = "src/main.rs"

[dependencies]
# The platform-agnostic protocol/worker/tray/config plumbing lives in
# xenia-launcher-shell now, shared with xenia-launcher-linux -- see that
# crate's own doc comment for exactly what moved there and why.
xenia-launcher-shell = { path = "../../crates/xenia-launcher-shell" }
xenia-launcher-core = { path = "../../crates/xenia-launcher-core" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Directly referenced for tray_icon::menu::MenuEvent/TrayIconEvent's event
# receivers in main.rs's tick loop, even though tray.rs's own construction
# logic now lives in xenia-launcher-shell.
tray-icon = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    # RegCreateKeyExW is gated behind this feature (confirmed via the real
    # windows-0.62.2 source: it's cfg'd out of Win32_System_Registry
    # without it).
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
