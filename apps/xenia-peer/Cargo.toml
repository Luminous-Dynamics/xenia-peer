[package]
name = "xenia-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Headless daemon that shares a screen over the Xenia wire. Hosts sessions; delegates capture/encode to xenia-peer-core. Pre-alpha stub — M1 adds real Wayland capture + H.264."
repository.workspace = true
homepage.workspace = true
publish = false  # unpublished until M1 makes it useful

[dependencies]
xenia-peer-core = { path = "../../crates/xenia-peer-core" }
xenia-capture = { path = "../../crates/xenia-capture" }
xenia-video = { path = "../../crates/xenia-video" }
xenia-transport-ws = { path = "../../crates/xenia-transport-ws" }
xenia-transport-quic = { path = "../../crates/xenia-transport-quic" }
xenia-ledger = { path = "../../crates/xenia-ledger" }
xenia-inject = { path = "../../crates/xenia-inject" }
xenia-operator-proto = { workspace = true }
xenia-secure-file = { path = "../../crates/xenia-secure-file" }
tokio-tungstenite = "0.24"

xenia-wire = { workspace = true, features = ["consent", "reference-frame", "operator-rekey", "handshake"] }
tokio = { workspace = true }
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
serde_json = "1"
hex = "0.4"
bincode = "1"
serde = { version = "1", features = ["derive"] }
chrono.workspace = true
blake3 = "1.5"
reqwest = { version = "0.13", features = ["json"] }
xenia-handshake = { path = "../../crates/xenia-handshake" }
# Only used to embed the operator console (`embedded-console` feature); the
# embed requires apps/sovereign-admin/dist/ to be trunk-built at compile time,
# so it is opt-in rather than a default compile-time coupling.
rust-embed = { version = "8.11.0", features = ["axum", "mime-guess"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
xenia-capture-scrcpy = { path = "../../crates/xenia-capture-scrcpy", optional = true }

[features]
scap = ["xenia-capture/scap-backend"]
# xdg-desktop-portal RemoteDesktop input-injection backend
# (--input-backend xdg-portal). Requires a live Wayland session with
# a RemoteDesktop-capable portal backend (GNOME/KDE); triggers an
# interactive consent dialog on first use. Off by default -- the
# `noop`/`log` backends need no extra system deps.
xdg-portal = ["xenia-inject/xdg-portal"]
# Kernel-level /dev/uinput input-injection backend (--input-backend
# uinput). Works without any compositor/portal/desktop session --
# needs root, `input` group membership, or a udev rule granting
# /dev/uinput access. Off by default.
uinput = ["xenia-inject/uinput"]
# Viewer/daemon protocol path for real host audio capture. Requires
# system audio headers on Linux; off by default.
audio-capture = ["xenia-capture/audio-cpal"]
audio-opus = ["xenia-peer-core/opus"]
# Pass-through: rebuild xenia-video with the h264 feature so the
# daemon can select `--codec h264` at runtime. Requires libav dev
# headers (enable inside nix develop).
h264 = ["xenia-video/h264"]
# HDC hybrid tile-delta codec (ported from Symthaea). Pure Rust,
# no external libs. Grayscale output.
hdc = ["xenia-video/hdc"]
# Phone-as-source capture (--phone-serial): streams a real Android
# device's screen via scrcpy-server over ADB instead of the host
# display. Requires libav dev headers (enable inside nix develop, same
# as h264) plus a device connected over USB with debugging authorized.
scrcpy = ["dep:xenia-capture-scrcpy", "xenia-capture-scrcpy/hevc"]
# Embed the built sovereign-admin operator console into the daemon binary and
# serve it from the admin port. Off by default because it requires
# apps/sovereign-admin/dist/ to be trunk-built at compile time (see
# admin_ui.rs); without it the daemon still serves /ws and /auth, and the
# console can run via `trunk serve`.
embedded-console = ["dep:rust-embed", "dep:mime_guess"]

# Local smoke/demo-only fixtures. Required for flags that bypass a real
# operator consent source; never enable for production or design-partner builds.
preprod-fixtures = []
# Propagate the ledger's explicit ML-DSA evidence verifier feature to the daemon
# verifier CLI. Off by default; this does not enable PQ runtime export.
pqc-signatures = ["xenia-ledger/pqc-signatures"]

[dev-dependencies]
# `ServiceExt::oneshot` for driving the operator-auth axum routes in tests
# without binding a real socket.
tower = { version = "0.5", features = ["util"] }
# Redundant with [dependencies] above (both `handshake` and `operator-rekey`
# are now production features -- `handshake` is needed there too for the
# `--operator-high-security` suite, `HostHandshakeHighSec`). Kept explicit
# here as a reminder for what the sealed-channel E2E tests actually exercise:
# they drive the *browser console's* exact wire code
# (xenia_wire::handshake::ViewerHandshake / handshake_highsec::ViewerHandshakeHighSec)
# against the live --operator-sealed endpoint, proving cross-compat with the
# daemon's own handshake drivers rather than asserting it separately.
xenia-wire = { workspace = true, features = ["handshake", "operator-rekey"] }
# Test-only: temp files for the operator-revocations file-parsing/reload tests.
tempfile = "3"
