[package]
name = "sovereign-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later"
description = "Leptos CSR admin console for the Xenia remote-session stack — the operator surface of the Mycelix Sovereign suite."
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "sovereign-admin"
path = "src/main.rs"

[dependencies]
bincode = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_meta = "0.8"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Storage", "Window", "Location"] }
serde = { version = "1.0", features = ["derive"] }
gloo-net = "0.6"

# Live xenia-ledger demo on the Sessions page.
xenia-ledger = { path = "../../crates/xenia-ledger" }
# Operator-RBAC ceremony (challenge/sign/verify against the daemon's /auth/*):
# the shared proto crate gives the exact signed transcripts + role model, and
# xenia-handshake supplies the *same* Ed25519 + ML-DSA-65 keygen/signing the
# daemon verifies against, so a browser-produced signature is byte-identical to
# what the daemon expects. (We only call its keygen/sign methods, never the
# SystemTime-using establish() paths, so it is wasm-safe at runtime.)
xenia-operator-proto = { path = "../../crates/xenia-operator-proto" }
xenia-handshake = { path = "../../crates/xenia-handshake" }
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
# Force getrandom to use Web Crypto in the browser (required by
# rand_core -> ed25519_dalek::SigningKey::generate in wasm32).
getrandom = { version = "0.2", features = ["js"] }
# Import / export of persisted chains on the Sessions page.
serde_json = "1"

# Real Holochain zome calls from the browser (resolve_did on login).
mycelix-leptos-client = { version = "0.1", default-features = false, features = ["browser"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ml-kem/ml-dsa (via xenia-handshake + xenia-ledger) resolve getrandom 0.3 AND
# 0.4, both semver-incompatible with the 0.2 chain (rand_core 0.6 / ed25519)
# above and with each other, so each needs its own wasm backend feature wired
# independently. Renamed packages avoid the key collision. The `wasm_js`
# feature alone selects the Web Crypto backend (no getrandom_backend cfg
# needed at these versions). Mirrors xenia-wire/xenia-viewer-web.
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# Native-only Mycelix crypto integration is intentionally not wired with an
# absolute local path here. Add it back via a workspace-relative dependency or
# feature-gated adapter once sovereign-admin has a native build target.
