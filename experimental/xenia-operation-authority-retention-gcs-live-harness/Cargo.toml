[package]
name = "xenia-operation-authority-retention-gcs-live-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Manual-only destructive GCS qualification harness for Xenia authority retention"

[workspace]

[features]
default = []
live-gcs-network = [
    "dep:google-cloud-storage",
    "dep:google-cloud-iam-v1",
    "dep:google-cloud-wkt",
    "dep:tokio",
]

[dependencies]
blake3 = "1"
thiserror = "2"
xenia-operation-authority-retention-gcs-live-qualification = { path = "../xenia-operation-authority-retention-gcs-live-qualification" }
google-cloud-storage = { version = "=1.18.0", default-features = false, features = ["default-rustls-provider"], optional = true }
google-cloud-iam-v1 = { version = "=1.12.0", default-features = false, optional = true }
google-cloud-wkt = { version = "=1.7.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[[bin]]
name = "xenia_gcs_admin_provision_v1"
path = "src/bin/admin_provision.rs"
required-features = ["live-gcs-network"]

[[bin]]
name = "xenia_gcs_runtime_permissions_v1"
path = "src/bin/runtime_permissions.rs"
required-features = ["live-gcs-network"]

[[bin]]
name = "xenia_gcs_admin_lock_v1"
path = "src/bin/admin_lock.rs"
required-features = ["live-gcs-network"]

[[bin]]
name = "xenia_gcs_admin_teardown_v1"
path = "src/bin/admin_teardown.rs"
required-features = ["live-gcs-network"]
