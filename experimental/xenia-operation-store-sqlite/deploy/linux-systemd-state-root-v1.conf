# Reference deployment fragment for ADR-012 / linux-systemd-state-root-v1.
#
# This is not a complete xenia-peer service unit. It captures only the filesystem
# authority assumptions for the privileged-operation receipt store.
#
# V1 deliberately uses a static dedicated service identity. Do not add DynamicUser=yes
# and continue claiming this exact profile without separate qualification.

[Service]
User=xenia
Group=xenia
StateDirectory=xenia/operation-store
StateDirectoryMode=0700
UMask=0077

# Recommended additive sandboxing. These controls must be qualified with the
# complete daemon because other Xenia features may require additional access.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
