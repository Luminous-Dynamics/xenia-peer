[package]
name = "xenia-operation-global-revocation-transition"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Authenticated same-store global-revocation transition verification for Xenia operation authority epochs"

[workspace]

[dependencies]
bincode = "1.3"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
xenia-ledger = { path = "../../crates/xenia-ledger" }
xenia-operation-authority-epoch = { path = "../../contracts/xenia-operation-authority-epoch" }
xenia-operation-frontier-governed-transition = { path = "../xenia-operation-frontier-governed-transition" }
xenia-operation-frontier-retention-bundle = { path = "../xenia-operation-frontier-retention-bundle" }
xenia-operation-store-frontier = { path = "../../contracts/xenia-operation-store-frontier" }

[dev-dependencies]
ed25519-dalek = "2"
uuid = "1"
xenia-operation-frontier-ledger-witness = { path = "../../contracts/xenia-operation-frontier-ledger-witness" }
