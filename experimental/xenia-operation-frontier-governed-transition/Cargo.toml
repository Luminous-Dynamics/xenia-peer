[package]
name = "xenia-operation-frontier-governed-transition"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tristan Stoltz"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/xenia-peer"
description = "Governed ledger-key/store-generation transition verification for retained Xenia operation authority witnesses"

[workspace]

[dependencies]
bincode = "1.3"
blake3 = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
thiserror = "2"
xenia-ledger = { path = "../../crates/xenia-ledger" }
xenia-operation-authority-epoch = { path = "../../contracts/xenia-operation-authority-epoch" }
xenia-operation-store-recovery = { path = "../../contracts/xenia-operation-store-recovery" }
xenia-operation-frontier-ledger-adapter = { path = "../xenia-operation-frontier-ledger-adapter" }
xenia-operation-frontier-retention-bundle = { path = "../xenia-operation-frontier-retention-bundle" }
xenia-operation-frontier-ledger-witness = { path = "../../contracts/xenia-operation-frontier-ledger-witness" }
xenia-operation-store-frontier = { path = "../../contracts/xenia-operation-store-frontier" }

[dev-dependencies]
uuid = "1"
