# Xenia secure-defaults manifest.
# This is not a substitute for a security review. It encodes the defaults that
# must remain true while Xenia is pre-production.

[manifest]
manifest_version = 1
stage = "pre-production"
owner = "xenia"

[secure_defaults]
remote_control_enabled_by_default = false
capture_enabled_by_default = false
injection_enabled_by_default = false
unattended_access_allowed = false
consent_required_for_privileged_sessions = true
consent_revocation_fail_closed = true
ledger_required_for_privileged_sessions = true
public_bind_requires_explicit_flag = true
default_bind_address = "127.0.0.1"
plaintext_credentials_allowed = false
silent_session_start_allowed = false

[network]
allowed_default_binds = ["127.0.0.1", "localhost", "::1"]
public_binds_requiring_review = ["0.0.0.0", "::", "[::]"]
# operator_exposure.rs is THE guard that refuses non-loopback binds without
# operator auth; its tests must reference "0.0.0.0" to prove the refusal. These
# are security-verifying test literals, not an insecure default.
allowed_public_bind_files = ["apps/xenia-peer/src/operator_exposure.rs"]

[scanner]
# Source/config files produce hard findings. Docs produce warnings.
source_extensions = [
  ".rs", ".toml", ".json", ".yaml", ".yml", ".ts", ".tsx", ".js", ".jsx", ".html", ".sh", ".py"
]
doc_extensions = [".md", ".rst", ".txt"]
exclude_dirs = [".git", ".claude", "target", "dist", "node_modules", ".direnv", "_archive", "xenia-peer-state", "xenia-operator-agent-state"]
exclude_files = [
  "scripts/check-secure-defaults.py",
  "scripts/generate-release-dashboard.py",
  "xenia.safety.toml"
]

[review_required_patterns]
# Keep this intentionally small and low-noise. The scanner treats exact strings
# as evidence that a security reviewer must look at the diff.
hard = [
  "consent_required = false",
  "consentRequired: false",
  "remote_control_enabled = true",
  "remoteControlEnabled: true",
  "capture_enabled = true",
  "injection_enabled = true",
  "unattended_access = true",
  "allow_unattended = true",
  "revocation_fail_open",
  "fail_open",
  "disable_consent",
  "bypass_consent",
  "skip_consent",
  "dangerously_disable"
]
warning = [
  "0.0.0.0",
  "[::]",
  "ws://",
  "http://",
  "allow_any_origin",
  "Access-Control-Allow-Origin: *"
]

[reviewed_warnings]
# Reviewed secure-default warning literals.
#
# These entries do not allow hard findings. They suppress warning-only literals
# when the path, matched pattern, and source text all match an explicit review
# rationale. Keep this list precise; do not replace it with broad file excludes.
entries = [
  { path = "README.md", pattern = "ws://", text_contains = "ws://...", reason = "README documents explicit WebSocket transport selection; it is not a default bind or privileged session start." },
  { path = "ROADMAP.md", pattern = "ws://", text_contains = "selected by `auto` for `ws://...`", reason = "Roadmap documents transport behavior, not a secure default." },
  { path = "apps/sovereign-admin/README.md", pattern = "http://", text_contains = "http://localhost:8134/login", reason = "Admin README uses loopback Trunk development URL." },
  { path = "apps/sovereign-admin/index.html", pattern = "ws://", text_contains = "ws://localhost:8888", reason = "Sovereign admin conductor URL example is loopback-only development configuration." },
  { path = "apps/sovereign-admin/src/config.rs", pattern = "http://", text_contains = "http://127.0.0.1:8134", reason = "Default admin endpoint is loopback-only during pre-production." },
  { path = "apps/sovereign-admin/src/pages/login.rs", pattern = "ws://", text_contains = "ws://localhost:8888", reason = "Default Holochain conductor endpoint is loopback-only development configuration." },
  { path = "apps/sovereign-admin/src/pages/consent.rs", pattern = "ws://", text_contains = "ws://127.0.0.1:8081/ws", reason = "Consent modal connects to loopback development websocket only." },
  { path = "apps/sovereign-admin/src/pages/consent.rs", pattern = "ws://", text_contains = "ws://127.0.0.1:8082", reason = "Consent approve/deny path targets loopback development websocket only." },
  { path = "apps/sovereign-admin/src/pages/monitor.rs", pattern = "http://", text_contains = "endpoint.replace(\"http://\", \"\")", reason = "Monitor derives a local development websocket host from the configured admin endpoint." },
  { path = "apps/sovereign-admin/src/pages/monitor.rs", pattern = "ws://", text_contains = "ws://{}:8430/v1/thoughts", reason = "Athena thought stream is a development-only websocket derived from the configured admin host." },
  { path = "apps/xenia-viewer/src/main.rs", pattern = "ws://", text_contains = "connect.starts_with(\"ws://\")", reason = "Viewer accepts explicit WebSocket URLs as user-selected transport, not as an insecure default." },
  { path = "apps/xenia-viewer/src/main.rs", pattern = "ws://", text_contains = "format!(\"ws://{connect}\")", reason = "Viewer normalizes explicit host input into WebSocket transport; this is user-selected connection behavior." },
  { path = "docs/security/SECURE_BY_DEFAULT_BASELINE.md", pattern = "0.0.0.0", text_contains = "0.0.0.0", reason = "Security baseline documents forbidden/review-required public bind examples." },
  { path = "docs/security/SECURE_BY_DEFAULT_BASELINE.md", pattern = "[::]", text_contains = "[::]", reason = "Security baseline documents forbidden/review-required public bind examples." },
  { path = "docs/security/SECURE_BY_DEFAULT_BASELINE.md", pattern = "skip_consent", text_contains = "skip_consent", reason = "Security baseline documents consent-bypass review triggers." },
  { path = "docs/security/SECURE_BY_DEFAULT_BASELINE.md", pattern = "disable_consent", text_contains = "disable_consent", reason = "Security baseline documents consent-bypass review triggers." },
  { path = "docs/security/SECURE_BY_DEFAULT_BASELINE.md", pattern = "bypass_consent", text_contains = "bypass_consent", reason = "Security baseline documents consent-bypass review triggers." },
  { path = "docs/security/SECURE_BY_DEFAULT_BASELINE.md", pattern = "fail_open", text_contains = "fail_open", reason = "Security baseline documents fail-open review triggers." },
  { path = "docs/implementation/NORMALIZATION_FOLLOWUPS.md", pattern = "ws://", text_contains = "local `http://` and `ws://` endpoints", reason = "Follow-up document tracks the secure-default review item itself." },
  { path = "docs/implementation/NORMALIZATION_FOLLOWUPS.md", pattern = "http://", text_contains = "local `http://` and `ws://` endpoints", reason = "Follow-up document tracks the secure-default review item itself." },
  { path = "crates/xenia-transport-ws/src/lib.rs", pattern = "ws://", text_contains = "format!(\"ws://{addr}\")", reason = "Literal appears in crate-local test code for loopback WebSocket conformance." },
  { path = "crates/xenia-transport-ws/tests/transport_conformance.rs", pattern = "ws://", text_contains = "format!(\"ws://{addr}\")", reason = "Literal appears in integration test code for loopback WebSocket conformance." },

  # V21.1 secure-default review: remaining literals after exact #[cfg(test)]
  # Rust filtering. These are intentionally narrow reviews, not broad file
  # exclusions; new unmatched literals still re-enter the review queue.
  { path = "ROADMAP.md", pattern = "http://", text_contains = "http://127.0.0.1:<admin-port>/", reason = "Roadmap records the verified loopback embedded-admin smoke test; this is validation evidence, not a deployment default." },
  { path = "apps/sovereign-admin/README.md", pattern = "ws://", text_contains = "ws://localhost:8888", reason = "README documents the loopback Holochain conductor used by the local development console." },
  { path = "apps/sovereign-admin/src/agent_client.rs", pattern = "http://", text_contains = "http://127.0.0.1:8180", reason = "Operator-agent default is deliberately loopback-only." },
  { path = "apps/sovereign-admin/src/config.rs", pattern = "http://", text_contains = "http://127.0.0.1:8081", reason = "Admin daemon default is deliberately loopback-only during pre-production." },
  { path = "apps/sovereign-admin/src/config.rs", pattern = "http://", text_contains = "strip_prefix(\"http://\")", reason = "Protocol parser recognizes an explicitly supplied HTTP scheme so it can derive the corresponding WebSocket authority; this is not a bind default." },
  { path = "apps/xenia-launcher-macos/src/startup.rs", pattern = "http://", text_contains = "http://www.apple.com/DTDs/PropertyList-1.0.dtd", reason = "Fixed Apple plist XML public identifier, not an application network endpoint." },
  { path = "apps/xenia-operator-agent/src/main.rs", pattern = "http://", text_contains = "http://127.0.0.1:8134", reason = "Default allowed console origins are loopback-only." },
  { path = "apps/xenia-operator-agent/src/main.rs", pattern = "http://", text_contains = "http://127.0.0.1:{}", reason = "Startup status message reports the loopback-only listener." },
  { path = "apps/xenia-peer/src/main.rs", pattern = "http://", text_contains = "http://127.0.0.1:8134", reason = "Default Sovereign Admin origins are loopback-only." },
  { path = "apps/xenia-peer/src/operator_live_smoke.rs", pattern = "http://", text_contains = "http://{addr}", reason = "Live-smoke harness constructs a URL for the explicitly supplied test listener address." },
  { path = "docs/deploy/remote-operators.md", pattern = "http://", text_contains = "proxy_pass http://127.0.0.1:8081", reason = "Reverse-proxy deployment example intentionally terminates TLS before forwarding to a loopback daemon." },
  { path = "docs/deploy/remote-operators.md", pattern = "http://", text_contains = "proxy_pass http://127.0.0.1:8082", reason = "Reverse-proxy deployment example intentionally forwards to the loopback consent service." },
  { path = "docs/deploy/remote-operators.md", pattern = "ws://", text_contains = "cannot open `ws://`", reason = "Documentation warns that HTTPS deployments require WSS rather than insecure mixed-content WebSockets." },
  { path = "docs/deploy/systemd-user-service.md", pattern = "http://", text_contains = "http://127.0.0.1:8081/health", reason = "Local health-check example targets the loopback daemon." },
  { path = "docs/deploy/systemd-user-service.md", pattern = "http://", text_contains = "http://127.0.0.1:8180/v1/health", reason = "Local health-check example targets the loopback operator agent." },
  { path = "docs/packaging/apt-repo.md", pattern = "http://", text_contains = "http://localhost:8000", reason = "Packaging documentation uses a temporary localhost HTTP server for repository testing only." },
  { path = "docs/security/OPERATOR_RBAC_PLAN.md", pattern = "http://", text_contains = "http://127.0.0.1:8081", reason = "Security design document references the pre-production loopback admin endpoint." },
  { path = "scripts/build-apt-repo.sh", pattern = "http://", text_contains = "http://localhost:8000", reason = "Generated instructions describe localhost-only APT repository testing." },
  { path = "scripts/e2e/vertical_slice.py", pattern = "http://", text_contains = "http://127.0.0.1:", reason = "End-to-end harness allocates ephemeral loopback HTTP services for deterministic local validation." },
  { path = "scripts/xenia-audio-e2e-smoke.sh", pattern = "ws://", text_contains = "ws://127.0.0.1:", reason = "Audio smoke harness uses an ephemeral loopback WebSocket listener." }
]
